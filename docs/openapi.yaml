    post:
      tags: [Commercial catalogue]
      summary: Create an approved effective reseller price version
      description: Price currency must equal the product currency; no FX is inferred. Reseller cost, minimum customer price and recommended markup are separate from the provider inference cost markup on billing_products. Requires an active matching resale grant, tenant.write, exact one-use owner approval, Idempotency-Key, and atomic audit.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerOrganizationId, resellerOrganizationId, productId, currency, resellerCost, minimumCustomerPrice, recommendedMarkupPercent, effectiveFrom, approvalId]
              properties:
                ownerOrganizationId: {type: string}
                resellerOrganizationId: {type: string}
                productId: {type: string}
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                resellerCost: {type: number, minimum: 0}
                minimumCustomerPrice: {type: number, minimum: 0}
                recommendedMarkupPercent: {type: number, minimum: 0, maximum: 500}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time, nullable: true}
                approvalId: {type: string}
      responses:
        '201': {description: Effective-dated reseller pricing version created}
        '400': {description: Invalid price, currency or effective period}
        '409': {description: Authorization, price interval, approval or idempotency conflict}
  /api/v1/commercial/legal-entities:
