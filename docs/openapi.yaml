openapi: 3.1.0
info:
  title: ALTIL Tenant, Governed AI and Communications API
  version: 1.1.0
  summary: Introsoft ALTIL multi-tenant AI SaaS platform
  description: >-
    Tenant onboarding, organization hierarchy, scoped API keys, license and quota
    enforcement, invoicing, governed AI inference and encrypted multi-channel communication.
    AI calls fail closed when tenant, application, key, billing or policy checks cannot pass.
servers:
  - url: https://api.introsoft.com
    description: Production API gateway
  - url: http://localhost:3005
    description: Local development
security:
  - ALTILKey: []
  - BearerSession: []
tags:
  - name: Public SaaS
  - name: Tenants and IAM
  - name: Commercial foundation
  - name: Developers
  - name: Packages and licensing
  - name: Billing
  - name: Governed AI
  - name: Communications
  - name: Mobile devices
paths:
  /api/v1/applications:
    get:
      tags: [Developers]
      summary: List applications visible in the caller's organization scope
      description: Returns applications from organizations visible under the authenticated ALTIL session. Application creation currently creates an initial inference credential as part of the same workflow.
      security:
        - BearerSession: []
      responses:
        '200':
          description: Visible application records
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DeveloperApplication'}}
        '401': {description: ALTIL session required}
        '403': {description: Organization read permission is not available}
    post:
      tags: [Developers]
      summary: Create an application and its initial inference credential
      description: Requires SUPER_ADMIN or TENANT_ADMIN plus tenant.update and apikeys.create for the same target organization. The generated credential secret is returned once in the response. Only the enforced read:inference scope is grantable.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                customerId: {type: string, description: Target organization; defaults to the authorized current organization}
                tenantId: {type: string, description: Legacy target-organization alias}
                appIdentifier: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'}
                description: {type: string, maxLength: 2000}
                environment: {type: string, enum: [development, staging, production], default: production}
                status: {type: string, enum: [active, suspended, revoked], default: active}
                allowedCapabilities: {type: array, maxItems: 50, items: {type: string, maxLength: 100}}
                assignedPolicyIds: {type: array, maxItems: 50, items: {type: string, maxLength: 128}}
                parentApplicationId: {type: [string, 'null']}
                applicationType: {type: string, enum: [application, sub_application, function]}
                functionIdentifier: {type: string, maxLength: 100}
                rateLimitRpm: {type: integer, minimum: 1, maximum: 1000000, default: 120}
                quotaMonthlyRequests: {type: integer, minimum: 1, maximum: 1000000000, default: 50000}
                contactEmail: {type: string, format: email, maxLength: 254}
      responses:
        '201':
          description: Application and one-time credential response
          content:
            application/json:
              schema:
                type: object
                required: [application, apiKey]
                properties:
                  application: {$ref: '#/components/schemas/DeveloperApplication'}
                  apiKey: {$ref: '#/components/schemas/DeveloperCredentialIssuedOnce'}
        '400': {description: Invalid application or parent-application fields}
        '401': {description: ALTIL session required}
        '403': {description: Role, organization authority, or runtime-scope grant denied}
        '503': {description: Application or credential registry unavailable}
  /api/v1/applications/{id}:
    put:
      tags: [Developers]
      summary: Update an application profile
      description: Updates allowlisted profile fields in the application's owning organization. Identity, organization, parent and application-type reassignment are rejected.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                appIdentifier: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'}
                description: {type: string, maxLength: 2000}
                status: {type: string, enum: [active, suspended, revoked]}
                environment: {type: string, enum: [development, staging, production]}
                allowedCapabilities: {type: array, maxItems: 50, items: {type: string, maxLength: 100}}
                assignedPolicyIds: {type: array, maxItems: 50, items: {type: string, maxLength: 128}}
                rateLimitRpm: {type: integer, minimum: 1, maximum: 1000000}
                quotaMonthlyRequests: {type: integer, minimum: 1, maximum: 1000000000}
                contactEmail: {type: string, format: email, maxLength: 254}
      responses:
        '200':
          description: Updated application record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeveloperApplication'}
        '400': {description: Unsupported or invalid update fields}
        '401': {description: ALTIL session required}
        '404': {description: Application not found in caller scope}
        '503': {description: Durable application update could not be confirmed}
    delete:
      tags: [Developers]
      summary: Delete an application and its associated credentials
      description: Requires tenant.update and apikeys.revoke on the owning organization. This operation removes application and credential records when persistence is enabled.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Application removed
          content:
            application/json:
              schema: {type: object, required: [success], properties: {success: {type: boolean, const: true}}}
        '401': {description: ALTIL session required}
        '404': {description: Application not found in caller scope}
        '503': {description: Durable application removal unavailable}
  /api/v1/api-keys:
    get:
      tags: [Developers]
      summary: List credential metadata visible in the caller's organization scope
      description: Secret and digest fields are omitted. Existing credential secrets cannot be revealed again.
      security:
        - BearerSession: []
      responses:
        '200':
          description: Visible credential metadata
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DeveloperCredentialMetadata'}}
        '401': {description: ALTIL session required}
        '403': {description: Organization read permission is not available}
    post:
      tags: [Developers]
      summary: Create an application-bound API credential
      description: Requires apikeys.create and SUPER_ADMIN or TENANT_ADMIN. The application must be active and belong to the authorized organization. Secret is returned once; only read:inference is currently grantable.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId: {type: string, description: Target organization; defaults to the authorized current organization}
                appId: {type: string}
                name: {type: string, maxLength: 120}
                scopes: {type: array, minItems: 1, maxItems: 1, items: {type: string, enum: [read:inference]}}
                ipWhitelist: {type: array, maxItems: 100, items: {type: string, description: IPv4 address or CIDR}}
                expiresAt: {type: [string, 'null'], format: date-time}
                rateLimitRpm: {type: integer, minimum: 1, maximum: 1000000, default: 120}
                monthlyRequestLimit: {type: [integer, 'null'], minimum: 1, maximum: 1000000000}
                monthlySpendLimitUsd: {type: [number, 'null'], minimum: 0, maximum: 1000000000}
                billingMode: {type: string, enum: [included, prepaid, metered]}
      responses:
        '201':
          description: Credential and one-time secret response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeveloperCredentialIssuedOnce'}
        '400': {description: Invalid credential restrictions or application binding}
        '401': {description: ALTIL session required}
        '403': {description: Role, organization authority, or requested scope denied}
        '503': {description: Credential registry unavailable; no credential was issued}
  /api/v1/api-keys/{id}/revoke:
    put:
      tags: [Developers]
      summary: Revoke a credential
      description: Requires apikeys.revoke and SUPER_ADMIN or TENANT_ADMIN for the owning organization. Revocation blocks use immediately in the current runtime.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Revoked credential metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeveloperCredentialMetadata'}
        '401': {description: ALTIL session required}
        '404': {description: Credential not found in caller scope}
        '503': {description: Durable revocation could not be confirmed}
  /api/v1/api-keys/{id}:
    delete:
      tags: [Developers]
      summary: Delete a credential record
      description: Requires explicit SUPER_ADMIN role and apikeys.revoke for the owning organization. This is deletion, not archive or rotation.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Credential removed
          content:
            application/json:
              schema: {type: object, required: [success], properties: {success: {type: boolean, const: true}}}
        '401': {description: ALTIL session required}
        '404': {description: Credential not found in caller scope}
        '503': {description: Durable deletion could not be confirmed}
  /api/v1/usage:
    get:
      tags: [Developers]
      summary: Read organization-scoped usage and quota aggregates
      description: Requires tenant.read. Daily success/failure, token totals and provider-share are returned as unavailable by the current handler; recorded aggregates may be absent.
      security:
        - BearerSession: []
      responses:
        '200':
          description: Scoped stored aggregates or explicit unavailable values
          content:
            application/json:
              schema:
                type: object
                properties:
                  chartData: {type: array, items: {type: object}}
                  todayRequests: {type: [integer, 'null']}
                  todaySuccessful: {type: [integer, 'null']}
                  todayFailed: {type: [integer, 'null']}
                  inputTokensToday: {type: [integer, 'null']}
                  outputTokensToday: {type: [integer, 'null']}
                  providerShare: {type: array, items: {type: object}}
                  applicationUsage: {type: array, items: {type: object, required: [id, name, requests, quota, status], properties: {id: {type: string}, name: {type: string}, requests: {type: integer}, quota: {type: integer}, quotaPct: {type: [integer, 'null']}, status: {type: string}}}}
                  recordedUsage: {type: [object, 'null']}
                  recordedUsageStatus: {type: string, enum: [AVAILABLE, NO_SCOPED_ROWS]}
                  activityWindow: {type: string}
        '401': {description: ALTIL session required}
        '403': {description: No organization usage scope assigned}
  /api/v1/logs:
    get:
      tags: [Developers]
      summary: Read audit and request activity within authorized organization scope
      description: >-
        Requires audit.read and an authorized audit role. Results for records without a known
        application-to-organization relationship are omitted for scoped callers. Stored prompt and
        response preview fields may be present; this handler does not establish policy-based
        redaction, so treat preview values as potentially sensitive.
      security:
        - BearerSession: []
      parameters:
        - {name: appId, in: query, required: false, schema: {type: string}}
        - {name: providerId, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: search, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Authorized audit records; preview fields may contain sensitive content
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DeveloperAuditEvent'}}
        '401': {description: ALTIL session required}
        '403': {description: Audit permission or role is not available}
  /api/v1/orchestrate:
    post:
      tags: [Governed AI]
      summary: Submit a legacy ALTIL orchestration request
      description: >-
        Existing compatibility route for governed orchestration. Prefer POST /v1/chat/completions
        for new AI integrations. Authenticate with x-api-key or a Bearer ALTIL session. The
        handler also accepts an API key in the JSON body for compatibility; do not use that form,
        because secrets in request bodies may be captured by client/server diagnostics. A valid
        API key requires read:inference. A successful request may call a configured external
        provider, update usage/quota state, and incur provider or tenant charges. Runtime behavior
        and persistence depend on deployment configuration; this operation has not been exercised
        by this source audit.
      security:
        - ALTILKey: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey: {type: string, writeOnly: true, description: Compatibility-only credential input. Prefer the x-api-key header.}
                appId: {type: string}
                capability: {type: string, default: general_ai}
                task: {type: string}
                model: {type: string}
                prompt: {type: string, writeOnly: true}
                input: {type: string, writeOnly: true}
                simulatePrimaryFailure: {type: boolean, description: Existing failure-simulation input; do not use for production requests.}
                simulateProviderFailure: {type: boolean, description: Existing failure-simulation input; do not use for production requests.}
      responses:
        '200':
          description: Orchestration result and request metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyOrchestrationResult'}
        '401': {description: Missing or invalid session/API credential}
        '402': {description: Tenant, license, request, or spend limit prevents execution}
        '403': {description: Credential, application, or tenant authorization denied}
        '404': {description: Requested model is not in the ALTIL catalogue}
        '422': {description: Policy or compliance rejected the request}
        '429': {description: Credential rate limit exceeded}
        '500': {description: Orchestration pipeline failure}
        '503': {description: Provider, billing, quota, or policy readiness unavailable}
  /api/v1/capabilities:
    get:
      tags: [Tenants and IAM]
      summary: Read the source-reviewed capability inventory
      description: >-
        Returns a deliberately partial source-reviewed list of routes, authorization requirements,
        scope, and implementation status. Availability is evaluated for the current ALTIL session
        where applicable. This checkout-based inventory does not prove production deployment;
        omitted entries are unassessed, not absent.
      security:
        - BearerSession: []
      responses:
        '200':
          description: Capability inventory for the authenticated identity
          content:
            application/json:
              schema:
                type: object
                required: [inventoryComplete, evidenceBasis, generatedAt, capabilities]
                properties:
                  inventoryComplete: {type: boolean, const: false}
                  evidenceBasis: {type: string}
                  generatedAt: {type: string, format: date-time}
                  capabilities:
                    type: array
                    items:
                      type: object
                      required: [id, domain, name, method, route, authentication, scope, status, availableToCurrentIdentity]
                      properties:
                        id: {type: string}
                        domain: {type: string}
                        name: {type: string}
                        description: {type: string}
                        method: {type: string}
                        route: {type: string}
                        authentication: {type: string, enum: [PUBLIC, ALTIL_SESSION, TENANT_API_KEY]}
                        requiredRoles: {type: array, items: {type: string}}
                        requiredPermissions: {type: array, items: {type: string}}
                        scope: {type: string, enum: [PUBLIC, PLATFORM, ORGANISATION, TENANT]}
                        status: {type: string, enum: [IMPLEMENTED, PARTIALLY_IMPLEMENTED, CONFIGURED, PLANNED, UNAVAILABLE, REQUIRES_AUTHORIZATION, NOT_ASSESSED]}
                        ui: {type: array, items: {type: string}}
                        source: {type: string}
                        limitations: {type: array, items: {type: string}}
                        availableToCurrentIdentity: {type: [boolean, 'null']}
        '401': {description: ALTIL session required}
  /api/v1/currency/config:
    get:
      tags: [Billing]
      summary: Read USD accounting base and configured display currencies
      responses:
        '200':
          description: Currency catalog, FX attribution, freshness and update timestamps
  /api/v1/tenant-portal/{id}/display-currency:
    patch:
      tags: [Tenants and IAM]
      summary: Set a tenant's display currency without changing source invoices
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayCurrency]
              properties:
                displayCurrency: {type: string, pattern: '^[A-Z]{3}$'}
      responses:
        '200': {description: Display preference saved; source records unchanged}
        '409': {description: FX rate missing or stale}
  /api/v1/admin/currency/config:
    put:
      tags: [Billing]
      summary: Configure default portal currency, locale and FX freshness window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultDisplayCurrency, defaultLocale, rateStaleAfterHours]
              properties:
                defaultDisplayCurrency: {type: string, pattern: '^[A-Z]{3}$'}
                defaultLocale: {type: string, maxLength: 32}
                rateStaleAfterHours: {type: integer, minimum: 1, maximum: 720}
      responses:
        '200': {description: USD accounting base retained; display defaults saved}
        '409': {description: Default currency has no fresh FX rate}
  /api/v1/admin/currency/rates/{currency}:
    put:
      tags: [Billing]
      summary: Create or update an attributed units-per-USD FX rate
      parameters:
        - {name: currency, in: path, required: true, schema: {type: string, pattern: '^[A-Z]{3}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitsPerUsd, source]
              properties:
                unitsPerUsd: {type: number, exclusiveMinimum: 0}
                source: {type: string, maxLength: 120}
      responses:
        '200': {description: Rate saved and appended to immutable rate history}
    delete:
      tags: [Billing]
      summary: Remove a display FX rate (USD cannot be removed)
      parameters:
        - {name: currency, in: path, required: true, schema: {type: string, pattern: '^[A-Z]{3}$'}}
      responses:
        '200': {description: Rate removed from current book; history retained}
  /api/v1/admin/currency/rates/{currency}/history:
    get:
      tags: [Billing]
      summary: Read attributed historical FX rate changes
      parameters:
        - {name: currency, in: path, required: true, schema: {type: string, pattern: '^[A-Z]{3}$'}}
      responses:
        '200': {description: Rate history with source, timestamp and editor}
  /api/v1/public/plans:
    get:
      tags: [Public SaaS]
      summary: List published self-service packages
      security: []
      responses:
        '200': {description: Published package catalogue}
  /api/v1/public/registrations:
    post:
      tags: [Public SaaS]
      summary: Register a new individual or company tenant
      description: Creates a 14-day trial workspace, tenant owner, first application and scoped API key. The full key is returned once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, accountType, planId, applicationName, acceptedTerms]
              properties:
                name: {type: string, minLength: 2, maxLength: 160}
                email: {type: string, format: email}
                password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
                accountType: {type: string, enum: [individual, company]}
                planId: {type: string}
                applicationName: {type: string}
                country: {type: string}
                acceptedTerms: {type: boolean, const: true}
      responses:
        '201': {description: Tenant, owner, application, trial and one-time key provisioned}
        '400': {description: Invalid signup data or unpublished package}
        '409': {description: Owner email already exists}
        '429': {description: Signup rate limit}
        '503': {description: Durable database or encryption prerequisites unavailable}
  /api/v1/admin/registrations:
    get:
      tags: [Tenants and IAM]
      summary: List self-service registrations
      responses:
        '200': {description: Registration feed (SUPER_ADMIN, FINOPS_MANAGER or SALES_MANAGER)}
        '403': {description: Insufficient role}
  /api/v1/admin/registrations/{id}:
    patch:
      tags: [Tenants and IAM]
      summary: Update registration follow-up state
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [contacted, closed, trial_active]}
      responses:
        '200': {description: Registration updated}
  /api/v1/customers:
    get:
      tags: [Tenants and IAM]
      summary: List tenant accounts in the caller's permitted scope
      responses:
        '200': {description: Tenant records}
    post:
      tags: [Tenants and IAM]
      summary: Admin-provision a tenant, owner, hierarchy node, application and optional key
      responses:
        '201': {description: Tenant provisioned}
  /api/v1/commercial/account-portal:
    get:
      tags: [Commercial foundation]
      summary: Read an authorized commercial account portal
      description: Operator requests require tenant.read and exactly one account identifier. A customer account user must have the single CUSTOMER_ACCOUNT_USER role and exactly one effective persisted account-IAM relationship, and must omit account identifiers; the server resolves only that linked customer/account. Organization summaries include only effective, explicit customer and technical-scope relationships in the caller's commercial scope. Financial aggregates are returned only when billing.read is independently granted and an explicit organization-to-tenant or customer-to-tenant link exists, except customer self views are limited to their explicit account link. Product catalogue visibility can use an explicit customer-owner organization without technical provisioning. Payment-intent captures are not bank-cash evidence.
      security:
        - BearerSession: []
      parameters:
        - {name: organizationId, in: query, required: false, schema: {type: string}}
        - {name: customerId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Authorized account identity, effective relationships, and conditionally authorized financial aggregates}
        '400': {description: Exactly one organizationId or customerId is required}
        '401': {description: ALTIL session required}
        '403': {description: tenant.read permission required}
        '404': {description: Account is not visible in the caller's authorized scope}
        '503': {description: Commercial account data is unavailable}
  /api/v1/commercial/account-portal/profile:
    patch:
      tags: [Commercial foundation]
      summary: Update allowlisted commercial account profile fields
      description: Operator updates require tenant.write and an effective explicit organization/customer relationship in scope. Customer self-service requires an active PRIMARY_CONTACT or ACCOUNT_ADMIN identity relationship and cannot select an account. Only supported profile fields are accepted; hierarchy, IAM, tenant ownership and financial fields are rejected. Idempotency-Key is required. The account update, audit row, and idempotency result are committed atomically.
      security: [{BearerSession: []}]
      parameters:
        - {name: organizationId, in: query, required: false, schema: {type: string}}
        - {name: customerId, in: query, required: false, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 180}
                displayName: {type: string, maxLength: 180}
                individualGivenName: {type: string, maxLength: 180}
                individualFamilyName: {type: string, maxLength: 180}
                companyName: {type: string, maxLength: 180}
                contact: {type: object, description: Allowlisted contact, addresses, and notification preferences}
      responses:
        '200': {description: Profile change persisted and audited}
        '400': {description: Unsupported field or invalid profile data}
        '401': {description: ALTIL session required}
        '403': {description: tenant.write permission required}
        '404': {description: Account is not visible in the caller's authorized scope}
        '409': {description: Idempotency key conflict}
        '503': {description: Profile update could not be completed}
  /api/v1/commercial/account-portal/identity-links:
    post:
      tags: [Commercial foundation]
      summary: Bind a tenantless IAM identity to a commercial account
      description: Requires a globally scoped SUPER_ADMIN with tenant.write, an exact single-use owner approval, and an active tenantless IAM user. The operation assigns only CUSTOMER_ACCOUNT_USER and creates no technical tenant, application, API credential, or provider access. Customer authentication must use the existing IAM login flow.
      security: [{BearerSession: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, customerId, userId, relationshipType, approvalId, evidenceReference]
              properties:
                accountId: {type: string}
                customerId: {type: string}
                userId: {type: string}
                relationshipType: {type: string, enum: [PRIMARY_CONTACT, ACCOUNT_ADMIN, BILLING_CONTACT, AUTHORIZED_CONTACT]}
                approvalId: {type: string}
                evidenceReference: {type: string, maxLength: 180}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time, nullable: true}
      responses:
        '201': {description: Tenantless IAM identity bound to one commercial account}
        '400': {description: Invalid identity relationship or effective period}
        '401': {description: ALTIL session required}
        '403': {description: Global Super Admin and tenant.write are required}
        '409': {description: Identity, relationship, or approval conflict}
        '503': {description: Identity relationship could not be completed}
  /api/v1/commercial/organizations:
    get:
      tags: [Commercial foundation]
      summary: Read explicit commercial organizations in authorized scope
      description: Commercial hierarchy comes only from commercial_organization_relationships. Tenant metadata and customer names do not establish commercial hierarchy. An explicit technical scope link and the existing IAM grant are both required for scoped access.
      security: [{BearerSession: []}]
      responses:
