openapi: 3.1.0
info:
  title: ALTIL Tenant, Governed AI and Communications API
  version: 1.1.0
  summary: Introsoft ALTIL multi-tenant AI SaaS platform
  description: >-
    Tenant onboarding, organization hierarchy, scoped API keys, license and quota
    enforcement, invoicing, governed AI inference and encrypted multi-channel communication.
    AI calls fail closed when tenant, application, key, billing or policy checks cannot pass.
servers:
  - url: /admin-test
    description: Test deployment (same-origin API base)
  - url: https://api.introsoft.com
    description: Production API gateway (requires its DNS and TLS endpoint to be available)
  - url: http://localhost:3005
    description: Local development
security:
  - ALTILKey: []
  - BearerSession: []
tags:
  - name: Public SaaS
  - name: Tenants and IAM
  - name: Commercial foundation
  - name: Developers
  - name: Packages and licensing
  - name: Billing
  - name: Governed AI
  - name: Communications
  - name: Mobile devices
paths:
  /api/v1/policies/{id}/evidence:
    post:
      tags: [Governed AI]
      summary: Record customer policy provenance for review
      description: Stores only a safe external source reference, SHA-256 hash, and allow-listed machine rules. Raw policy documents and credentials are never persisted. Mandatory-baseline conflicts are rejected before approval.
      security: [{BearerSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceReference, contentHash, extractedRules]
              properties:
                evidenceKind: {type: string, enum: [ORIGINAL_DOCUMENT, MACHINE_EXTRACTION], default: ORIGINAL_DOCUMENT}
                sourceReference: {type: string, maxLength: 256, description: External document reference only; do not send raw documents or secrets.}
                contentHash: {type: string, pattern: '^[a-fA-F0-9]{64}$', description: SHA-256 hash of the source document.}
                contentType: {type: string, maxLength: 128}
                extractionVersion: {type: string, maxLength: 64}
                extractedRules: {type: object, description: Allow-listed candidate policy rules only.}
      responses:
        '202': {description: Evidence persisted and is pending owner approval}
        '400': {description: Unsafe reference, invalid hash, or unsupported extracted rule}
        '404': {description: Policy is outside the caller's authorized scope}
        '409': {description: Imported policy conflicts with the mandatory baseline}
        '503': {description: Durable evidence persistence unavailable}
  /api/v1/policies/{id}/evidence/{evidenceId}/approve:
    post:
      tags: [Governed AI]
      summary: Record owner approval for policy evidence
      description: Appends an approval decision. Approval does not alter the active policy until the explicit activation operation.
      security: [{BearerSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: evidenceId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalReference]
              properties:
                approvalReference: {type: string, maxLength: 256}
      responses:
        '200': {description: Owner approval recorded}
        '400': {description: Invalid approval reference}
        '404': {description: Policy or evidence is outside the caller's authorized scope}
        '409': {description: Evidence is not eligible for approval}
  /api/v1/policies/{id}/evidence/{evidenceId}/activate:
    post:
      tags: [Governed AI]
      summary: Activate an approved policy evidence snapshot
      description: Rechecks mandatory baseline conflicts, persists a new policy snapshot through the existing policy repository, and appends an activation review.
      security: [{BearerSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: evidenceId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Activated policy snapshot}
        '404': {description: Policy or evidence is outside the caller's authorized scope}
        '409': {description: Approval is missing or the current baseline now conflicts}
        '503': {description: Durable policy activation unavailable}
  /api/v1/applications:
    get:
      tags: [Developers]
      summary: List applications visible in the caller's organization scope
      description: Returns applications from organizations visible under the authenticated ALTIL session. Application creation currently creates an initial inference credential as part of the same workflow.
      security:
        - BearerSession: []
      responses:
        '200':
          description: Visible application records
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DeveloperApplication'}}
        '401': {description: ALTIL session required}
        '403': {description: Organization read permission is not available}
    post:
      tags: [Developers]
      summary: Create an application and its initial inference credential
      description: Requires SUPER_ADMIN or TENANT_ADMIN plus tenant.update and apikeys.create for the same target organization. The generated credential secret is returned once in the response. Only the enforced read:inference scope is grantable.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                customerId: {type: string, description: Target organization; defaults to the authorized current organization}
                tenantId: {type: string, description: Legacy target-organization alias}
                appIdentifier: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'}
                description: {type: string, maxLength: 2000}
                environment: {type: string, enum: [development, staging, production], default: production}
                status: {type: string, enum: [active, suspended, revoked], default: active}
                allowedCapabilities: {type: array, maxItems: 50, items: {type: string, maxLength: 100}}
                assignedPolicyIds: {type: array, maxItems: 50, items: {type: string, maxLength: 128}}
                parentApplicationId: {type: [string, 'null']}
                applicationType: {type: string, enum: [application, sub_application, function]}
                functionIdentifier: {type: string, maxLength: 100}
                rateLimitRpm: {type: integer, minimum: 1, maximum: 1000000, default: 120}
                quotaMonthlyRequests: {type: integer, minimum: 1, maximum: 1000000000, default: 50000}
                contactEmail: {type: string, format: email, maxLength: 254}
      responses:
        '201':
          description: Application and one-time credential response
          content:
            application/json:
              schema:
                type: object
                required: [application, apiKey]
                properties:
                  application: {$ref: '#/components/schemas/DeveloperApplication'}
                  apiKey: {$ref: '#/components/schemas/DeveloperCredentialIssuedOnce'}
        '400': {description: Invalid application or parent-application fields}
        '401': {description: ALTIL session required}
        '403': {description: Role, organization authority, or runtime-scope grant denied}
        '503': {description: Application or credential registry unavailable}
  /api/v1/applications/{id}:
    put:
      tags: [Developers]
      summary: Update an application profile
      description: Updates allowlisted profile fields in the application's owning organization. Identity, organization, parent and application-type reassignment are rejected.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                appIdentifier: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'}
                description: {type: string, maxLength: 2000}
                status: {type: string, enum: [active, suspended, revoked]}
                environment: {type: string, enum: [development, staging, production]}
                allowedCapabilities: {type: array, maxItems: 50, items: {type: string, maxLength: 100}}
                assignedPolicyIds: {type: array, maxItems: 50, items: {type: string, maxLength: 128}}
                rateLimitRpm: {type: integer, minimum: 1, maximum: 1000000}
                quotaMonthlyRequests: {type: integer, minimum: 1, maximum: 1000000000}
                contactEmail: {type: string, format: email, maxLength: 254}
      responses:
        '200':
          description: Updated application record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeveloperApplication'}
        '400': {description: Unsupported or invalid update fields}
        '401': {description: ALTIL session required}
        '404': {description: Application not found in caller scope}
        '503': {description: Durable application update could not be confirmed}
    delete:
      tags: [Developers]
      summary: Delete an application and its associated credentials
      description: Requires tenant.update and apikeys.revoke on the owning organization. This operation removes application and credential records when persistence is enabled.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Application removed
          content:
            application/json:
              schema: {type: object, required: [success], properties: {success: {type: boolean, const: true}}}
        '401': {description: ALTIL session required}
        '404': {description: Application not found in caller scope}
        '503': {description: Durable application removal unavailable}
  /api/v1/api-keys:
    get:
      tags: [Developers]
      summary: List credential metadata visible in the caller's organization scope
      description: Secret and digest fields are omitted. Existing credential secrets cannot be revealed again.
      security:
        - BearerSession: []
      responses:
        '200':
          description: Visible credential metadata
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DeveloperCredentialMetadata'}}
        '401': {description: ALTIL session required}
        '403': {description: Organization read permission is not available}
    post:
      tags: [Developers]
      summary: Create an application-bound API credential
      description: Requires apikeys.create and SUPER_ADMIN or TENANT_ADMIN. The application must be active and belong to the authorized organization. Secret is returned once; only read:inference is currently grantable.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId: {type: string, description: Target organization; defaults to the authorized current organization}
                appId: {type: string}
                name: {type: string, maxLength: 120}
                scopes: {type: array, minItems: 1, maxItems: 1, items: {type: string, enum: [read:inference]}}
                ipWhitelist: {type: array, maxItems: 100, items: {type: string, description: IPv4 address or CIDR}}
                expiresAt: {type: [string, 'null'], format: date-time}
                rateLimitRpm: {type: integer, minimum: 1, maximum: 1000000, default: 120}
                monthlyRequestLimit: {type: [integer, 'null'], minimum: 1, maximum: 1000000000}
                monthlySpendLimitUsd: {type: [number, 'null'], minimum: 0, maximum: 1000000000}
                billingMode: {type: string, enum: [included, prepaid, metered]}
      responses:
        '201':
          description: Credential and one-time secret response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeveloperCredentialIssuedOnce'}
        '400': {description: Invalid credential restrictions or application binding}
        '401': {description: ALTIL session required}
        '403': {description: Role, organization authority, or requested scope denied}
        '503': {description: Credential registry unavailable; no credential was issued}
  /api/v1/api-keys/{id}/revoke:
    put:
      tags: [Developers]
      summary: Revoke a credential
      description: Requires apikeys.revoke and SUPER_ADMIN or TENANT_ADMIN for the owning organization. Revocation blocks use immediately in the current runtime.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Revoked credential metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeveloperCredentialMetadata'}
        '401': {description: ALTIL session required}
        '404': {description: Credential not found in caller scope}
        '503': {description: Durable revocation could not be confirmed}
  /api/v1/api-keys/{id}/rotate:
    post:
      tags: [Developers]
      summary: Rotate a credential
      description: Requires apikeys.create and apikeys.revoke for the owning organization. Returns the replacement secret once, records replacementOf, and keeps the predecessor active only for the requested overlap window unless compromised=true.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                overlapDays: {type: integer, minimum: 0, maximum: 30, default: 1}
                compromised: {type: boolean, default: false}
      responses:
        '201':
          description: Replacement credential and one-time secret
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeveloperCredentialIssuedOnce'}
        '401': {description: ALTIL session required}
        '403': {description: Credential creation/revocation permission or organization scope denied}
        '404': {description: Credential not found in caller scope}
        '409': {description: Only active credentials can be rotated}
        '503': {description: Durable rotation could not be confirmed}
  /api/v1/api-keys/{id}:
    delete:
      tags: [Developers]
      summary: Delete a credential record
      description: Requires explicit SUPER_ADMIN role and apikeys.revoke for the owning organization. This is deletion, not archive or rotation.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Credential removed
          content:
            application/json:
              schema: {type: object, required: [success], properties: {success: {type: boolean, const: true}}}
        '401': {description: ALTIL session required}
        '404': {description: Credential not found in caller scope}
        '503': {description: Durable deletion could not be confirmed}
  /api/v1/pem/entities:
    get:
      tags: [Governed AI]
      summary: Read customer-scoped PEM entities
      description: Returns opaque pseudonyms and entity metadata for the explicitly authorized tenant. Deterministic identifiers and original content are never returned.
      security:
        - BearerSession: []
      parameters:
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: PEM entity inventory}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope required}
        '503': {description: PEM persistence unavailable}
  /api/v1/pem/entities/resolve:
    post:
      tags: [Governed AI]
      summary: Resolve or create a customer-scoped PEM entity
      description: Uses deterministic identifiers only. The response exposes an opaque entity and pseudonym, never the submitted identifiers.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, entityType, deterministicIdentifiers]
              properties:
                customerId: {type: string}
                entityType: {type: string}
                deterministicIdentifiers: {type: object, additionalProperties: {type: string}}
                classification: {type: string}
                confidence: {type: number, minimum: 0, maximum: 1}
                evidence: {type: object, additionalProperties: true}
      responses:
        '200': {description: Existing PEM entity matched}
        '201': {description: New PEM entity created}
        '400': {description: Invalid or ambiguous deterministic resolution}
        '401': {description: ALTIL session required}
        '403': {description: Entity scope or security/compliance role denied}
  /api/v1/pem/entities/candidates:
    post:
      tags: [Governed AI]
      summary: Find descriptive PEM candidates for human review
      description: Returns advisory candidates using hashed descriptive signals. This endpoint never creates, merges or authorizes an identity.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, entityType, descriptiveAttributes]
              properties:
                customerId: {type: string}
                entityType: {type: string}
                descriptiveAttributes: {type: object, additionalProperties: {type: string}}
                minimumConfidence: {type: number, minimum: 0, maximum: 1, default: 0.5}
      responses:
        '200': {description: Review-required candidates; no identity decision was made}
        '400': {description: Invalid candidate request}
        '401': {description: ALTIL session required}
        '403': {description: Entity scope or security/compliance role denied}
  /api/v1/pem/entities/{id}:
    get:
      tags: [Governed AI]
      summary: Read one PEM entity
      description: Returns an authorized entity and opaque pseudonym history without deterministic identifiers or original content.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: PEM entity details}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope required}
        '404': {description: Entity not found in caller scope}
  /api/v1/pem/relationships:
    get:
      tags: [Governed AI]
      summary: Read persisted PEM relationships
      description: Returns explicitly persisted, customer-scoped relationships with evidence status and effective dates.
      security:
        - BearerSession: []
      parameters:
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: PEM relationships}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope required}
        '503': {description: PEM persistence unavailable}
    post:
      tags: [Governed AI]
      summary: Record an explicitly evidenced PEM relationship
      description: Relationships are customer-scoped and must identify their evidence kind. Inferred relationships remain provisional.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, sourceEntityId, targetEntityId, relationshipType, evidenceKind, confidence]
              properties:
                customerId: {type: string}
                sourceEntityId: {type: string}
                targetEntityId: {type: string}
                relationshipType: {type: string}
                evidenceKind: {type: string, enum: [DETERMINISTIC, INFERRED, HUMAN_CONFIRMED]}
                confidence: {type: number, minimum: 0, maximum: 1}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time}
                evidence: {type: object, additionalProperties: true}
      responses:
        '201': {description: PEM relationship recorded}
        '400': {description: Invalid relationship or entity scope}
        '401': {description: ALTIL session required}
        '403': {description: Relationship scope or security/compliance role denied}
  /api/v1/pem/relationships/{id}/review:
    post:
      tags: [Governed AI]
      summary: Confirm or reject a PEM relationship
      description: Records a reviewer decision without deleting or rewriting the original relationship evidence.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, decision]
              properties:
                customerId: {type: string}
                decision: {type: string, enum: [ACTIVE, REJECTED]}
                reason: {type: string}
      responses:
        '200': {description: Relationship review recorded}
        '400': {description: Invalid review or relationship not found}
        '401': {description: ALTIL session required}
        '403': {description: Relationship scope or security/compliance role denied}
  /api/v1/pem/entities/{id}/compromise:
    post:
      tags: [Governed AI]
      summary: Rotate a compromised PEM pseudonym
      description: Retires the compromised pseudonym, preserves entity history and returns the replacement opaque pseudonym once.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '201': {description: Replacement pseudonym created}
        '400': {description: Invalid compromise request}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope denied}
        '404': {description: Entity not found in caller scope}
  /api/v1/pem/entities/{id}/corrections:
    get:
      tags: [Governed AI]
      summary: Read append-only PEM identity correction history
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Versioned correction history}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope required}
    post:
      tags: [Governed AI]
      summary: Record a reviewed identity correction
      description: Corrections append immutable history and never rewrite historical evidence.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, correctionType, reason]
              properties:
                customerId: {type: string}
                correctionType: {type: string, enum: [ATTRIBUTE_CORRECTION, IDENTITY_RESOLUTION_ERROR, SAME_AS]}
                correctedEntityId: {type: string}
                reason: {type: string}
                evidence: {type: object, additionalProperties: true}
      responses:
        '201': {description: Correction recorded}
        '400': {description: Invalid correction}
        '401': {description: ALTIL session required}
        '403': {description: Correction scope or security/compliance role denied}
  /api/v1/pem/documents:
    get:
      tags: [Governed AI]
      summary: Read customer-scoped PEM document evidence metadata
      description: Returns document hashes and metadata only. Original content is held behind the protected content-store boundary.
      security:
        - BearerSession: []
      parameters:
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: PEM document metadata inventory}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope required}
        '503': {description: PEM persistence unavailable}
    post:
      tags: [Governed AI]
      summary: Record PEM document metadata
      description: Records an immutable content hash and evidence metadata; raw document content is never accepted by this endpoint.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, contentHash, source]
              properties:
                customerId: {type: string}
                organizationId: {type: string}
                matterId: {type: string}
                contentHash: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
                documentVersion: {type: integer, minimum: 1}
                source: {type: string}
                classification: {type: string}
                retentionPolicyId: {type: string}
                legalHold: {type: boolean}
                metadata: {type: object, additionalProperties: true}
      responses:
        '201': {description: Document metadata recorded}
        '400': {description: Invalid document metadata}
        '401': {description: ALTIL session required}
        '403': {description: Document scope is not authorized}
  /api/v1/pem/documents/{id}:
    get:
      tags: [Governed AI]
      summary: Read one PEM document and evidence references
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Document hash and evidence metadata}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope required}
        '404': {description: Document not found in caller scope}
  /api/v1/pem/documents/{id}/content:
    get:
      tags: [Governed AI]
      summary: Read authorized original document content
      description: Returns original bytes only from the configured encrypted/customer-managed content-store boundary. Raw content is never returned in metadata APIs.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Original content bytes; content type and SHA-256 are returned in response headers}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope required}
        '404': {description: Original content not available in caller scope}
        '503': {description: Protected content store unavailable}
    post:
      tags: [Governed AI]
      summary: Store original document content behind the protected content boundary
      description: Accepts base64 bytes only after the registered document SHA-256 is verified. The raw bytes are encrypted by the configured content-store adapter and are never written to ordinary PEM metadata tables.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentBase64]
              properties:
                contentBase64: {type: string, format: byte, maxLength: 14000000}
                contentType: {type: string, maxLength: 128}
                source: {type: string, maxLength: 128}
      responses:
        '201': {description: Original content stored}
        '200': {description: Existing original content replaced after hash verification}
        '400': {description: Invalid base64 content}
        '401': {description: ALTIL session required}
        '403': {description: Document scope is not authorized}
        '404': {description: Document not found in caller scope}
        '409': {description: Hash mismatch or legal hold prevents replacement}
        '503': {description: Protected content store unavailable}
    delete:
      tags: [Governed AI]
      summary: Delete original document content while retaining its evidence hash
      description: Deletion is refused while the document is under legal hold. Document metadata, evidence references and content hash remain durable after raw content deletion.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Original content deleted and evidence hash retained}
        '401': {description: ALTIL session required}
        '403': {description: Document scope is not authorized}
        '404': {description: Original content not found in caller scope}
        '409': {description: Legal hold prevents deletion}
  /api/v1/pem/documents/{id}/legal-hold:
    patch:
      tags: [Governed AI]
      summary: Set or release an original-content legal hold
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalHold]
              properties:
                legalHold: {type: boolean}
      responses:
        '200': {description: Legal hold updated}
        '400': {description: legalHold must be boolean}
        '401': {description: ALTIL session required}
        '403': {description: Document scope is not authorized}
        '404': {description: Document not found in caller scope}
        '409': {description: Legal hold operation could not be completed}
  /api/v1/pem/documents/{id}/evidence:
    post:
      tags: [Governed AI]
      summary: Record page/section evidence for a PEM document
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityId, detectionMethod, confidence, resolverVersion]
              properties:
                entityId: {type: string}
                pageNumber: {type: integer}
                sectionName: {type: string}
                paragraphRef: {type: string}
                characterStart: {type: integer}
                characterEnd: {type: integer}
                detectionMethod: {type: string}
                confidence: {type: number, minimum: 0, maximum: 1}
                resolverVersion: {type: string}
                transactionId: {type: string}
      responses:
        '201': {description: Document evidence recorded}
        '400': {description: Invalid evidence metadata}
        '401': {description: ALTIL session required}
        '403': {description: Evidence scope is not authorized}
        '404': {description: Document not found in caller scope}
  /api/v1/pem/policy-evidence:
    get:
      tags: [Governed AI]
      summary: Read customer policy interpretation evidence
      description: Returns versioned machine-readable policy decisions, including explicit uncertainty states.
      security:
        - BearerSession: []
      parameters:
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Policy evidence inventory}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope required}
        '503': {description: Policy evidence persistence unavailable}
    post:
      tags: [Governed AI]
      summary: Record customer policy interpretation evidence
      description: Records a policy interpretation for review or activation. Uncertain interpretations require an uncertainty reason.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, policyCode, policyVersion, interpretation, decision]
              properties:
                customerId: {type: string}
                policyCode: {type: string}
                policyVersion: {type: string}
                sourceDocumentId: {type: string}
                interpretation: {type: object, additionalProperties: true}
                decision: {type: string, enum: [PENDING_REVIEW, ACTIVE, REJECTED, UNCERTAIN]}
                uncertaintyReason: {type: string}
      responses:
        '201': {description: Policy evidence recorded}
        '400': {description: Invalid policy evidence}
        '401': {description: ALTIL session required}
        '403': {description: Policy evidence scope or security/compliance role denied}
  /api/v1/pem/retention-policies:
    get:
      tags: [Governed AI]
      summary: Read customer retention policies
      security:
        - BearerSession: []
      parameters:
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Retention policy inventory}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope required}
        '503': {description: Retention policy persistence unavailable}
    post:
      tags: [Governed AI]
      summary: Record a customer retention policy
      description: Retention periods are versioned and legal holds remain authoritative. Customer policy cannot weaken mandatory minimums enforced by the service.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, policyCode, version]
              properties:
                customerId: {type: string}
                policyCode: {type: string}
                version: {type: string}
                originalContentDays: {type: integer, minimum: 0}
                documentEvidenceDays: {type: integer, minimum: 0}
                pemMappingDays: {type: integer, minimum: 0}
                dcrMappingDays: {type: integer, minimum: 0}
                auditEvidenceDays: {type: integer, minimum: 0}
                securityEventDays: {type: integer, minimum: 0}
                legalHoldEnabled: {type: boolean}
                status: {type: string, enum: [DRAFT, ACTIVE, RETIRED]}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time}
      responses:
        '201': {description: Retention policy recorded}
        '400': {description: Invalid retention policy}
        '401': {description: ALTIL session required}
        '403': {description: Retention policy scope or security/compliance role denied}
  /api/v1/pem/uncertainty:
    get:
      tags: [Governed AI]
      summary: Read the regulatory uncertainty register
      security:
        - BearerSession: []
      parameters:
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Customer-scoped uncertainty records}
        '401': {description: ALTIL session required}
        '403': {description: Security/compliance role or tenant scope required}
    post:
      tags: [Governed AI]
      summary: Record an unresolved classification or policy uncertainty
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, category, subjectType, description]
              properties:
                customerId: {type: string}
                category: {type: string, enum: [CLASSIFICATION, JURISDICTION, POLICY_INTERPRETATION, CONFLICTING_POLICY, MISSING_RULE, UNKNOWN_ENTITY, UNKNOWN_RELATIONSHIP, DOCUMENT_CONTEXT]}
                subjectType: {type: string}
                subjectId: {type: string}
                description: {type: string}
                appliedSafeguard: {type: string}
                status: {type: string, enum: [OPEN, RESOLVED, ACCEPTED_RISK]}
                transactionId: {type: string}
      responses:
        '201': {description: Uncertainty record created}
        '400': {description: Invalid uncertainty record}
        '401': {description: ALTIL session required}
        '403': {description: Uncertainty scope or security/compliance role denied}
  /api/v1/environments:
    get:
      tags: [Developers]
      summary: List explicit customer environments
      description: Returns persisted environment entities. Legacy application environment labels remain valid until an explicit environment is bound.
      security:
        - BearerSession: []
      parameters:
        - {name: tenantId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Environment inventory}
        '401': {description: ALTIL session required}
        '403': {description: Tenant scope or permission denied}
        '503': {description: Environment persistence unavailable}
    post:
      tags: [Developers]
      summary: Create an explicit customer environment
      description: Environment creation is tenant-scoped and does not change legacy application labels.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, environmentCode, name]
              properties:
                customerId: {type: string}
                applicationId: {type: string}
                environmentCode: {type: string, pattern: '^[a-z][a-z0-9_-]{1,63}$'}
                name: {type: string}
                status: {type: string, enum: [active, suspended, retired]}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time}
      responses:
        '201': {description: Environment created}
        '400': {description: Invalid environment or application binding}
        '401': {description: ALTIL session required}
        '403': {description: Tenant scope or permission denied}
        '503': {description: Environment persistence unavailable}
  /api/v1/environments/{id}:
    put:
      tags: [Developers]
      summary: Update an explicit customer environment
      description: Environment lifecycle changes are audited; retire rather than delete to preserve binding history.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                status: {type: string, enum: [active, suspended, retired]}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time}
      responses:
        '200': {description: Environment updated}
        '400': {description: Invalid environment update}
        '401': {description: ALTIL session required}
        '403': {description: Tenant scope or permission denied}
        '404': {description: Environment not found in caller scope}
        '503': {description: Environment persistence unavailable}
  /api/v1/usage:
    get:
      tags: [Developers]
      summary: Read organization-scoped usage and quota aggregates
      description: Requires tenant.read. Daily success/failure, token totals and provider-share are returned as unavailable by the current handler; recorded aggregates may be absent.
      security:
        - BearerSession: []
      responses:
        '200':
          description: Scoped stored aggregates or explicit unavailable values
          content:
            application/json:
              schema:
                type: object
                properties:
                  chartData: {type: array, items: {type: object}}
                  todayRequests: {type: [integer, 'null']}
                  todaySuccessful: {type: [integer, 'null']}
                  todayFailed: {type: [integer, 'null']}
                  inputTokensToday: {type: [integer, 'null']}
                  outputTokensToday: {type: [integer, 'null']}
                  providerShare: {type: array, items: {type: object}}
                  applicationUsage: {type: array, items: {type: object, required: [id, name, requests, quota, status], properties: {id: {type: string}, name: {type: string}, requests: {type: integer}, quota: {type: integer}, quotaPct: {type: [integer, 'null']}, status: {type: string}}}}
                  recordedUsage: {type: [object, 'null']}
                  recordedUsageStatus: {type: string, enum: [AVAILABLE, NO_SCOPED_ROWS]}
                  activityWindow: {type: string}
        '401': {description: ALTIL session required}
        '403': {description: No organization usage scope assigned}
  /api/v1/logs:
    get:
      tags: [Developers]
      summary: Read audit and request activity within authorized organization scope
      description: >-
        Requires audit.read and an authorized audit role. Results for records without a known
        application-to-organization relationship are omitted for scoped callers. Stored prompt and
        response preview fields may be present; this handler does not establish policy-based
        redaction, so treat preview values as potentially sensitive.
      security:
        - BearerSession: []
      parameters:
        - {name: appId, in: query, required: false, schema: {type: string}}
        - {name: providerId, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: search, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Authorized audit records; preview fields may contain sensitive content
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DeveloperAuditEvent'}}
        '401': {description: ALTIL session required}
        '403': {description: Audit permission or role is not available}
  /api/v1/orchestrate:
    post:
      tags: [Governed AI]
      summary: Submit a legacy ALTIL orchestration request
      description: >-
        Existing compatibility route for governed orchestration. Prefer POST /v1/chat/completions
        for new AI integrations. Authenticate with x-api-key or a Bearer ALTIL session. The
        handler also accepts an API key in the JSON body for compatibility; do not use that form,
        because secrets in request bodies may be captured by client/server diagnostics. A valid
        API key requires read:inference. A successful request may call a configured external
        provider, update usage/quota state, and incur provider or tenant charges. Runtime behavior
        and persistence depend on deployment configuration; this operation has not been exercised
        by this source audit.
      security:
        - ALTILKey: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey: {type: string, writeOnly: true, description: Compatibility-only credential input. Prefer the x-api-key header.}
                appId: {type: string}
                capability: {type: string, default: general_ai}
                task: {type: string}
                model: {type: string}
                prompt: {type: string, writeOnly: true}
                input: {type: string, writeOnly: true}
                simulatePrimaryFailure: {type: boolean, description: Existing failure-simulation input; do not use for production requests.}
                simulateProviderFailure: {type: boolean, description: Existing failure-simulation input; do not use for production requests.}
      responses:
        '200':
          description: Orchestration result and request metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyOrchestrationResult'}
        '401': {description: Missing or invalid session/API credential}
        '402': {description: Tenant, license, request, or spend limit prevents execution}
        '403': {description: Credential, application, or tenant authorization denied}
        '404': {description: Requested model is not in the ALTIL catalogue}
        '422': {description: Policy or compliance rejected the request}
        '429': {description: Credential rate limit exceeded}
        '500': {description: Orchestration pipeline failure}
        '503': {description: Provider, billing, quota, or policy readiness unavailable}
  /api/v1/capabilities:
    get:
      tags: [Tenants and IAM]
      summary: Read the source-reviewed capability inventory
      description: >-
        Returns a deliberately partial source-reviewed list of routes, authorization requirements,
        scope, and implementation status. Availability is evaluated for the current ALTIL session
        where applicable. This checkout-based inventory does not prove production deployment;
        omitted entries are unassessed, not absent.
      security:
        - BearerSession: []
      responses:
        '200':
          description: Capability inventory for the authenticated identity
          content:
            application/json:
              schema:
                type: object
                required: [inventoryComplete, evidenceBasis, generatedAt, capabilities]
                properties:
                  inventoryComplete: {type: boolean, const: false}
                  evidenceBasis: {type: string}
                  generatedAt: {type: string, format: date-time}
                  capabilities:
                    type: array
                    items:
                      type: object
                      required: [id, domain, name, method, route, authentication, scope, status, availableToCurrentIdentity]
                      properties:
                        id: {type: string}
                        domain: {type: string}
                        name: {type: string}
                        description: {type: string}
                        method: {type: string}
                        route: {type: string}
                        authentication: {type: string, enum: [PUBLIC, ALTIL_SESSION, TENANT_API_KEY]}
                        requiredRoles: {type: array, items: {type: string}}
                        requiredPermissions: {type: array, items: {type: string}}
                        scope: {type: string, enum: [PUBLIC, PLATFORM, ORGANISATION, TENANT]}
                        status: {type: string, enum: [IMPLEMENTED, PARTIALLY_IMPLEMENTED, CONFIGURED, PLANNED, UNAVAILABLE, REQUIRES_AUTHORIZATION, NOT_ASSESSED]}
                        ui: {type: array, items: {type: string}}
                        source: {type: string}
                        limitations: {type: array, items: {type: string}}
                        availableToCurrentIdentity: {type: [boolean, 'null']}
        '401': {description: ALTIL session required}
  /api/v1/currency/config:
    get:
      tags: [Billing]
      summary: Read USD accounting base and configured display currencies
      responses:
        '200':
          description: Currency catalog, FX attribution, freshness and update timestamps
  /api/v1/tenant-portal/{id}/display-currency:
    patch:
      tags: [Tenants and IAM]
      summary: Set a tenant's display currency without changing source invoices
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayCurrency]
              properties:
                displayCurrency: {type: string, pattern: '^[A-Z]{3}$'}
      responses:
        '200': {description: Display preference saved; source records unchanged}
        '409': {description: FX rate missing or stale}
  /api/v1/admin/currency/config:
    put:
      tags: [Billing]
      summary: Configure default portal currency, locale and FX freshness window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultDisplayCurrency, defaultLocale, rateStaleAfterHours]
              properties:
                defaultDisplayCurrency: {type: string, pattern: '^[A-Z]{3}$'}
                defaultLocale: {type: string, maxLength: 32}
                rateStaleAfterHours: {type: integer, minimum: 1, maximum: 720}
      responses:
        '200': {description: USD accounting base retained; display defaults saved}
        '409': {description: Default currency has no fresh FX rate}
  /api/v1/admin/currency/rates/{currency}:
    put:
      tags: [Billing]
      summary: Create or update an attributed units-per-USD FX rate
      parameters:
        - {name: currency, in: path, required: true, schema: {type: string, pattern: '^[A-Z]{3}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitsPerUsd, source]
              properties:
                unitsPerUsd: {type: number, exclusiveMinimum: 0}
                source: {type: string, maxLength: 120}
      responses:
        '200': {description: Rate saved and appended to immutable rate history}
    delete:
      tags: [Billing]
      summary: Remove a display FX rate (USD cannot be removed)
      parameters:
        - {name: currency, in: path, required: true, schema: {type: string, pattern: '^[A-Z]{3}$'}}
      responses:
        '200': {description: Rate removed from current book; history retained}
  /api/v1/admin/currency/rates/{currency}/history:
    get:
      tags: [Billing]
      summary: Read attributed historical FX rate changes
      parameters:
        - {name: currency, in: path, required: true, schema: {type: string, pattern: '^[A-Z]{3}$'}}
      responses:
        '200': {description: Rate history with source, timestamp and editor}
  /api/v1/public/plans:
    get:
      tags: [Public SaaS]
      summary: List published self-service packages
      security: []
      responses:
        '200': {description: Published package catalogue}
  /api/v1/public/registrations:
    post:
      tags: [Public SaaS]
      summary: Register a new individual or company tenant
      description: Creates a 14-day trial workspace, tenant owner, first application and scoped API key. The full key is returned once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, accountType, planId, applicationName, acceptedTerms]
              properties:
                name: {type: string, minLength: 2, maxLength: 160}
                email: {type: string, format: email}
                password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
                accountType: {type: string, enum: [individual, company]}
                planId: {type: string}
                applicationName: {type: string}
                country: {type: string}
                acceptedTerms: {type: boolean, const: true}
      responses:
        '201': {description: Tenant, owner, application, trial and one-time key provisioned}
        '400': {description: Invalid signup data or unpublished package}
        '409': {description: Owner email already exists}
        '429': {description: Signup rate limit}
        '503': {description: Durable database or encryption prerequisites unavailable}
  /api/v1/admin/registrations:
    get:
      tags: [Tenants and IAM]
      summary: List self-service registrations
      responses:
        '200': {description: Registration feed (SUPER_ADMIN, FINOPS_MANAGER or SALES_MANAGER)}
        '403': {description: Insufficient role}
  /api/v1/admin/registrations/{id}:
    patch:
      tags: [Tenants and IAM]
      summary: Update registration follow-up state
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [contacted, closed, trial_active]}
      responses:
        '200': {description: Registration updated}
  /api/v1/customers:
    get:
      tags: [Tenants and IAM]
      summary: List tenant accounts in the caller's permitted scope
      responses:
        '200': {description: Tenant records}
    post:
      tags: [Tenants and IAM]
      summary: Admin-provision a tenant, owner, hierarchy node, application and optional key
      responses:
        '201': {description: Tenant provisioned}
  /api/v1/iam/login-events:
    get:
      tags: [Tenants and IAM]
      summary: Read recent sign-in history and client IPs
      description: Requires audit.read and an authorized audit role. Results are limited to the caller's global or tenant audit scope and the preceding five days. Passwords, hashes, tokens, and user-agent strings are not returned.
      security: [{BearerSession: []}]
      parameters:
        - {name: email, in: query, required: false, schema: {type: string, format: email}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Recent sign-in attempts with identity, outcome, time and IP address}
        '400': {description: Invalid email filter}
        '401': {description: ALTIL session required}
        '403': {description: Audit role, permission or tenant scope is unavailable}
        '503': {description: Durable IAM database is unavailable}
  /api/v1/commercial/account-portal:
    get:
      tags: [Commercial foundation]
      summary: Read an authorized commercial account portal
      description: Operator requests require tenant.read and exactly one account identifier. A customer account user must have the single CUSTOMER_ACCOUNT_USER role and exactly one effective persisted account-IAM relationship, and must omit account identifiers; the server resolves only that linked customer/account. Organization summaries include only effective, explicit customer and technical-scope relationships in the caller's commercial scope. Financial aggregates are returned only when billing.read is independently granted and an explicit organization-to-tenant or customer-to-tenant link exists, except customer self views are limited to their explicit account link. Product catalogue visibility can use an explicit customer-owner organization without technical provisioning. Payment-intent captures are not bank-cash evidence.
      security:
        - BearerSession: []
      parameters:
        - {name: organizationId, in: query, required: false, schema: {type: string}}
        - {name: customerId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Authorized account identity, effective relationships, and conditionally authorized financial aggregates}
        '400': {description: Exactly one organizationId or customerId is required}
        '401': {description: ALTIL session required}
        '403': {description: tenant.read permission required}
        '404': {description: Account is not visible in the caller's authorized scope}
        '503': {description: Commercial account data is unavailable}
  /api/v1/commercial/account-portal/profile:
    patch:
      tags: [Commercial foundation]
      summary: Update allowlisted commercial account profile fields
      description: Operator updates require tenant.write and an effective explicit organization/customer relationship in scope. Customer self-service requires an active PRIMARY_CONTACT or ACCOUNT_ADMIN identity relationship and cannot select an account. Only supported profile fields are accepted; hierarchy, IAM, tenant ownership and financial fields are rejected. Idempotency-Key is required. The account update, audit row, and idempotency result are committed atomically.
      security: [{BearerSession: []}]
      parameters:
        - {name: organizationId, in: query, required: false, schema: {type: string}}
        - {name: customerId, in: query, required: false, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 180}
                displayName: {type: string, maxLength: 180}
                individualGivenName: {type: string, maxLength: 180}
                individualFamilyName: {type: string, maxLength: 180}
                companyName: {type: string, maxLength: 180}
                contact: {type: object, description: Allowlisted contact, addresses, and notification preferences}
      responses:
        '200': {description: Profile change persisted and audited}
        '400': {description: Unsupported field or invalid profile data}
        '401': {description: ALTIL session required}
        '403': {description: tenant.write permission required}
        '404': {description: Account is not visible in the caller's authorized scope}
        '409': {description: Idempotency key conflict}
        '503': {description: Profile update could not be completed}
  /api/v1/commercial/account-portal/identity-links:
    post:
      tags: [Commercial foundation]
      summary: Bind a tenantless IAM identity to a commercial account
      description: Requires a globally scoped SUPER_ADMIN with tenant.write, an exact single-use owner approval, and an active tenantless IAM user. The operation assigns only CUSTOMER_ACCOUNT_USER and creates no technical tenant, application, API credential, or provider access. Customer authentication must use the existing IAM login flow.
      security: [{BearerSession: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, customerId, userId, relationshipType, approvalId, evidenceReference]
              properties:
                accountId: {type: string}
                customerId: {type: string}
                userId: {type: string}
                relationshipType: {type: string, enum: [PRIMARY_CONTACT, ACCOUNT_ADMIN, BILLING_CONTACT, AUTHORIZED_CONTACT]}
                approvalId: {type: string}
                evidenceReference: {type: string, maxLength: 180}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time, nullable: true}
      responses:
        '201': {description: Tenantless IAM identity bound to one commercial account}
        '400': {description: Invalid identity relationship or effective period}
        '401': {description: ALTIL session required}
        '403': {description: Global Super Admin and tenant.write are required}
        '409': {description: Identity, relationship, or approval conflict}
        '503': {description: Identity relationship could not be completed}
  /api/v1/commercial/organizations:
    get:
      tags: [Commercial foundation]
      summary: Read explicit commercial organizations in authorized scope
      description: Commercial hierarchy comes only from commercial_organization_relationships. Tenant metadata and customer names do not establish commercial hierarchy. An explicit technical scope link and the existing IAM grant are both required for scoped access.
      security: [{BearerSession: []}]
      responses:
        '200': {description: Authorized commercial organizations, explicit hierarchy edges, and directly related customers}
        '401': {description: ALTIL session required}
        '403': {description: tenant.read permission required}
    post:
      tags: [Commercial foundation]
      summary: Create a commercial organization under an explicit parent
      description: Requires tenant.write and authorized access to the parent organization. Requires a matching unused owner approval. Does not create a technical tenant, application, or credential. Introsoft root is seeded by migration 025. All commercial mutations require Idempotency-Key; replay returns the stored status and body, while reuse with a different request returns 409. Mutation, approval use, audit row, and idempotency completion share one database transaction.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, organizationType, parentOrganizationId, approvalId]
              properties:
                name: {type: string, maxLength: 180}
                organizationType: {type: string, enum: [SUBSIDIARY, PARTNER, RESELLER]}
                parentOrganizationId: {type: string}
                approvalId: {type: string}
      responses:
        '201': {description: Commercial organization and parent relationship created}
        '400': {description: Invalid request}
        '403': {description: tenant.write permission or parent scope unavailable}
        '409': {description: Approval conflict or idempotency key reused with a different request}
  /api/v1/commercial/customers:
    get:
      tags: [Commercial foundation]
      summary: Read commercial customers linked to authorized organizations
      description: Returns only buyer records with an explicit active customer-to-organization relationship in the caller's independently authorized scope.
      security: [{BearerSession: []}]
      responses:
        '200': {description: Commercial buyer records}
        '401': {description: ALTIL session required}
        '403': {description: tenant.read permission required}
    post:
      tags: [Commercial foundation]
      summary: Create a commercial customer without technical provisioning
      description: Requires tenant.write, authorized organization scope, and a matching unused owner approval. Customer creation does not create a tenant, application, API key, or commercial account. All commercial mutations require Idempotency-Key; replay returns the stored result and reuse with a different request returns 409. Mutation, approval use, audit row, and idempotency completion share one database transaction.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerType, displayName, organizationId, approvalId]
              properties:
                customerType: {type: string, enum: [INDIVIDUAL, COMPANY]}
                displayName: {type: string, maxLength: 180}
                companyName: {type: string, maxLength: 180}
                individualGivenName: {type: string, maxLength: 100}
                individualFamilyName: {type: string, maxLength: 100}
                organizationId: {type: string}
                approvalId: {type: string}
                contact:
                  type: object
                  additionalProperties: false
                  properties:
                    email: {type: string, maxLength: 254}
                    phone: {type: string, maxLength: 254}
                    billingEmail: {type: string, maxLength: 254}
                    address:
                      type: object
                      additionalProperties: false
                      properties:
                        line1: {type: string, maxLength: 160}
                        line2: {type: string, maxLength: 160}
                        city: {type: string, maxLength: 160}
                        region: {type: string, maxLength: 160}
                        postalCode: {type: string, maxLength: 160}
                        country: {type: string, maxLength: 160}
      responses:
        '201': {description: Commercial customer and explicit customer-organization relationship created}
        '400': {description: Invalid customer type or missing required variant data}
        '403': {description: tenant.write permission or organization scope unavailable}
        '409': {description: Approval conflict or idempotency key reused with a different request}
  /api/v1/commercial/accounts:
    post:
      tags: [Commercial foundation]
      summary: Create a commercial account for an authorized customer
      description: Requires tenant.write, an explicit customer-organization relationship in authorized scope, and a matching unused owner approval. The customer and account remain distinct records. All commercial mutations require Idempotency-Key; replay returns the stored result and reuse with a different request returns 409. Mutation, approval use, audit row, and idempotency completion share one database transaction.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, accountName, approvalId]
              properties:
                customerId: {type: string}
                accountName: {type: string, maxLength: 180}
                legalEntityId: {type: string}
                approvalId: {type: string}
      responses:
        '201': {description: Commercial account created}
        '400': {description: Invalid account or legal entity ownership}
        '403': {description: tenant.write permission or customer scope unavailable}
        '409': {description: Approval conflict or idempotency key reused with a different request}
  /api/v1/commercial/evidence-approvals:
    post:
      tags: [Commercial foundation]
      summary: Record a one-use owner approval for commercial creation
      description: Requires an explicitly global SUPER_ADMIN grant and tenant.write permission. The approval is scoped to one organization, operation, optional customer, and for technical scope or Phase B1 catalogue operations the exact target identifiers and normalized requested details. It can be consumed once. All commercial mutations require Idempotency-Key; replay returns the stored result and reuse with a different request returns 409.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, operation, evidenceReference, reason]
              properties:
                organizationId: {type: string}
                operation: {type: string, enum: [ORGANIZATION_CREATE, CUSTOMER_CREATE, LEGAL_ENTITY_CREATE, ACCOUNT_CREATE, ORGANIZATION_TENANT_SCOPE_CREATE, PRODUCT_RELATIONSHIP_CREATE, RESELLER_PRODUCT_AUTHORIZATION_CREATE, RESELLER_PRODUCT_PRICE_CREATE]}
                customerId: {type: string}
                targetTenantId: {type: string}
                targetOrganizationId: {type: string, description: Required for reseller authorization and pricing approvals.}
                targetProductId: {type: string, description: Required for Phase B1 product approval.}
                requestedDetails: {type: object, description: Exact allowlisted operation fields; excludes secrets and unrelated personal data.}
                scopeLinkType: {type: string, enum: [PRIMARY, PRODUCTION, SANDBOX, DEVELOPMENT]}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time, nullable: true}
                evidenceReference: {type: string, maxLength: 180}
                reason: {type: string, maxLength: 500}
      responses:
        '201': {description: Owner approval recorded for one use}
        '403': {description: Global SUPER_ADMIN grant and tenant.write required}
        '409': {description: Idempotency key reused with a different request}
  /api/v1/commercial/organization-tenant-scopes:
    post:
      tags: [Commercial foundation]
      summary: Link a technical tenant to one commercial organization
      description: Requires SUPER_ADMIN, tenant.write, a GLOBAL Super Admin grant, technical tenant authorization, and an exact one-use approval. Organizations may link many tenants; a tenant can have only one overlapping active/effective organization owner. Overlap checks are serialized by locking the technical tenant row. Commercial links do not grant IAM access. All commercial mutations require Idempotency-Key.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, tenantId, scopeLinkType, effectiveFrom, approvalId]
              properties:
                organizationId: {type: string}
                tenantId: {type: string}
                scopeLinkType: {type: string, enum: [PRIMARY, PRODUCTION, SANDBOX, DEVELOPMENT]}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time, nullable: true}
                approvalId: {type: string}
      responses:
        '201': {description: Effective-dated commercial organization to technical tenant link created}
        '400': {description: Invalid link type or effective period}
        '403': {description: Required Super Admin or tenant.write authorization unavailable}
        '404': {description: Organization or tenant is outside authorized scope}
        '409': {description: Approval unavailable, conflicting scope interval, or changed idempotency request}
  /api/v1/commercial/organizations/{organizationId}/technical-scopes:
    get:
      tags: [Commercial foundation]
      summary: Read explicitly linked technical tenant scopes for an organization
      parameters:
        - {name: organizationId, in: path, required: true, schema: {type: string}}
      security: [{BearerSession: []}]
      responses:
        '200': {description: Technical scopes linked to the authorized commercial organization}
        '404': {description: Organization is outside authorized scope}
  /api/v1/commercial/catalogue:
    get:
      tags: [Commercial catalogue]
      summary: Read the existing billing product catalogue with relationships and separate resale authority
      description: Requires billing.read and an explicitly authorized organizationId. Product visibility does not grant resale rights; resaleAuthorized is true only for an active, effective persisted product authorization.
      parameters:
        - {name: organizationId, in: query, required: true, schema: {type: string}}
      security: [{BearerSession: []}]
      responses:
        '200': {description: Existing billing products, effective product relationships and per-organization resale flags}
        '404': {description: Organization is outside authorized scope}
  /api/v1/commercial/catalogue/relationships:
    post:
      tags: [Commercial catalogue]
      summary: Create an approved product relationship or bundle membership
      description: Uses existing billing_products identities. BUNDLE_MEMBER is stored as a product relationship and requires a bundle product parent plus a non-bundle member. Recommendations and upgrade guidance require an explanation. Requires GLOBAL Super Admin, tenant.write, exact one-use owner approval, Idempotency-Key, and one atomic transaction for relationship, approval use, audit and idempotency result.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceProductId, targetProductId, relationshipType, effectiveFrom, approvalId]
              properties:
                sourceProductId: {type: string}
                targetProductId: {type: string}
                relationshipType: {type: string, enum: [REQUIRES, RECOMMENDS, COMPATIBLE_WITH, INCOMPATIBLE_WITH, UPGRADE_TO, DOWNGRADE_TO, ADD_ON, BUNDLE_MEMBER, ALTERNATIVE, REPLACEMENT, FOLLOW_ON]}
                quantity: {type: number, exclusiveMinimum: 0, default: 1}
                explanation: {type: string, maxLength: 500}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time, nullable: true}
                approvalId: {type: string}
      responses:
        '201': {description: Product relationship or bundle membership created}
        '400': {description: Invalid relationship, bundle definition or effective period}
        '409': {description: Conflicting relationship, approval or idempotency key}
  /api/v1/commercial/reseller-authorizations:
    get:
      tags: [Commercial catalogue]
      summary: Read reseller product authorizations for an authorized organization
      parameters:
        - {name: organizationId, in: query, required: true, schema: {type: string}}
      security: [{BearerSession: []}]
      responses:
        '200': {description: Explicit owner-to-reseller product grants and effective status}
        '404': {description: Organization is outside authorized scope}
    post:
      tags: [Commercial catalogue]
      summary: Authorize a directly related reseller to sell one product
      description: Requires tenant.write in the owner scope, an explicit active direct reseller relationship covering the entire authorization period, an Introsoft-descendant owner, exact one-use global owner approval, and Idempotency-Key. This grant does not create IAM access or expose unrelated customers.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerOrganizationId, resellerOrganizationId, productId, effectiveFrom, approvalId]
              properties:
                ownerOrganizationId: {type: string}
                resellerOrganizationId: {type: string}
                productId: {type: string}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time, nullable: true}
                approvalId: {type: string}
      responses:
        '201': {description: Effective-dated product resale authority created}
        '403': {description: tenant.write or required scope unavailable}
        '409': {description: Relationship, approval, interval or idempotency conflict}
  /api/v1/commercial/reseller-pricing:
    get:
      tags: [Commercial catalogue]
      summary: Read effective reseller prices for an authorized reseller organization
      parameters:
        - {name: resellerOrganizationId, in: query, required: true, schema: {type: string}}
        - {name: ownerOrganizationId, in: query, required: false, schema: {type: string}, description: Optional owner filter; the caller must be authorized for the owner or reseller organization.}
      security: [{BearerSession: []}]
      responses:
        '200': {description: Current authorized reseller cost, minimum customer price and explainable recommended price}
        '404': {description: Requested price scope is not authorized}
    post:
      tags: [Commercial catalogue]
      summary: Create an approved effective reseller price version
      description: Price currency must equal the product currency; no FX is inferred. Reseller cost, minimum customer price and recommended markup are separate from the provider inference cost markup on billing_products. Requires an active matching resale grant, tenant.write, exact one-use owner approval, Idempotency-Key, and atomic audit.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerOrganizationId, resellerOrganizationId, productId, currency, resellerCost, minimumCustomerPrice, recommendedMarkupPercent, effectiveFrom, approvalId]
              properties:
                ownerOrganizationId: {type: string}
                resellerOrganizationId: {type: string}
                productId: {type: string}
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                resellerCost: {type: number, minimum: 0}
                minimumCustomerPrice: {type: number, minimum: 0}
                recommendedMarkupPercent: {type: number, minimum: 0, maximum: 500}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time, nullable: true}
                approvalId: {type: string}
      responses:
        '201': {description: Effective-dated reseller pricing version created}
        '400': {description: Invalid price, currency or effective period}
        '409': {description: Authorization, price interval, approval or idempotency conflict}
  /api/v1/commercial/legal-entities:
    post:
      tags: [Commercial foundation]
      summary: Create a customer legal entity
      description: Requires tenant.write, an explicit customer relationship in scope, and matching unused owner approval. Registration references are stored but not returned by the read endpoint. All commercial mutations require Idempotency-Key; replay returns the stored result and reuse with a different request returns 409. Mutation, approval use, audit row, and idempotency completion share one database transaction.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, legalName, jurisdiction, approvalId]
              properties:
                customerId: {type: string}
                legalName: {type: string, maxLength: 180}
                jurisdiction: {type: string, pattern: '^[A-Z]{2}$'}
                registrationReference: {type: string, maxLength: 160}
                approvalId: {type: string}
      responses:
        '201': {description: Commercial legal entity created}
        '400': {description: Invalid legal entity details}
        '409': {description: Matching owner approval unavailable or already used}
  /api/v1/commercial/customers/{customerId}/legal-entities:
    get:
      tags: [Commercial foundation]
      summary: List legal entities for an authorized commercial customer
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      security: [{BearerSession: []}]
      responses:
        '200': {description: Legal entity metadata without registration references}
        '404': {description: Customer is outside authorized scope}
  /api/v1/customers/{id}/users:
    post:
      tags: [Tenants and IAM]
      summary: Add a tenant-scoped user
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '201': {description: User created}
  /api/v1/licensing/plans:
    get:
      tags: [Packages and licensing]
      summary: List package and licence templates
      responses:
        '200': {description: Plan catalogue}
    post:
      tags: [Packages and licensing]
      summary: Create or publish a commercial package
      responses:
        '200': {description: Plan saved}
  /api/v1/licensing/tenant-licenses:
    get:
      tags: [Packages and licensing]
      summary: List tenant application licences in caller scope
      responses:
        '200': {description: Tenant licences}
  /api/v1/licensing/tenant-licenses/update:
    post:
      tags: [Packages and licensing]
      summary: Assign, update or reactivate an application licence
      responses:
        '200': {description: Licence saved}
  /api/v1/billing/invoices:
    get:
      tags: [Billing]
      summary: List invoices in caller scope
      responses:
        '200': {description: Invoice register}
    post:
      tags: [Billing]
      summary: Create a draft invoice for a tenant and billing period
      responses:
        '201': {description: Draft invoice created}
  /api/v1/billing/invoices/{id}/issue:
    post:
      tags: [Billing]
      summary: Issue a draft invoice and advance the related billing cycle
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Invoice issued}
        '409': {description: Invoice is not a draft}
  /api/v1/billing/invoices/{id}/payment:
    post:
      tags: [Billing]
      summary: Record an operator-attested manual receipt against an issued invoice
      description: Requires an evidence reference and idempotency key. This records a manual receipt in suspense and does not represent provider confirmation or settlement.
      security:
        - BearerSession: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, evidenceReference]
              properties:
                amount: {type: number, exclusiveMinimum: 0}
                currency: {type: string, description: Must match the invoice currency}
                evidenceReference: {type: string, minLength: 3, maxLength: 120}
      responses:
        '201': {description: Manual receipt, invoice update, suspense journal and audit record committed atomically; providerConfirmed is false}
        '200': {description: Idempotent replay of an already recorded manual receipt}
        '400': {description: Invalid amount, currency, evidence reference or idempotency key}
        '403': {description: Billing write permission is required}
        '404': {description: Invoice not found in authorized scope}
        '409': {description: Invoice state or idempotency conflict}
        '503': {description: Durable transaction failed; no financial writes were committed}
  /api/v1/billing/ledger:
    get:
      tags: [Billing]
      summary: List tenant accounting entries in caller scope
      responses:
        '200': {description: Append-only ledger entries}
    post:
      tags: [Billing]
      summary: Record a credit, refund, write-off or adjustment
      responses:
        '201': {description: Accounting entry recorded}
  /api/v1/billing/cycles/run:
    post:
      tags: [Billing]
      summary: Prepare reviewable invoice drafts for due application licences
      responses:
        '200': {description: Due billing cycles prepared}
  /api/v1/models:
    get:
      tags: [Governed AI]
      summary: List routeable live provider models
      description: Returns only live-discovered and inference-verified models from provider connections authorized for the caller's tenant, application and API key. API-key callers require the currently enforced `read:inference` scope. No upstream catalogue refresh is triggered by this read.
      security:
        - ALTILKey: []
        - BearerSession: []
      responses:
        '200':
          description: OpenAI-compatible model list from the ALTIL registry
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: {type: string, const: list}
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, created, owned_by]
                      properties:
                        id: {type: string}
                        object: {type: string, const: model}
                        created: {type: integer}
                        owned_by: {type: string}
                        name: {type: string}
                        context_length: {type: integer}
                        capabilities: {type: array, items: {type: string}}
        '401': {description: API key or session is required}
        '403': {description: Tenant scope or inference permission denied}
        '429': {description: Key rate limit reached}
        '503': {description: OpenRouter runtime is not configured}
  /api/v1/provider-accounts:
    get:
      tags: [Governed AI]
      summary: List provider connections visible to the authenticated operator
      description: Returns redacted connection metadata only. Credentials are encrypted server-side and are never returned. Results are restricted to a global Super Admin grant or the caller's customer-managed connections.
      security:
        - BearerSession: []
      responses:
        '200': {description: Visible provider connection metadata and live verification state}
        '401': {description: Session is required}
        '403': {description: Provider read permission or scope is missing}
    post:
      tags: [Governed AI]
      summary: Create an encrypted provider connection
      description: Creates an ALTIL-managed or customer-managed/BYOK connection. Customer-managed connections require an ownerId within the caller's scope; byokOnly prevents fallback to ALTIL-managed credentials. The connection is not routeable until live credential and model inference verification succeeds.
      security:
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, label, apiKey]
              properties:
                providerId: {type: string}
                label: {type: string}
                apiKey: {type: string, writeOnly: true}
                ownerType: {type: string, enum: [ALTIL_MANAGED, CUSTOMER_MANAGED]}
                ownerId: {type: string}
                byokOnly: {type: boolean}
      responses:
        '201': {description: Encrypted connection metadata; secret is not returned}
        '400': {description: Invalid provider, owner or credential input}
        '401': {description: Session is required}
        '403': {description: Provider configuration permission or scope is missing}
  /api/v1/provider-accounts/{id}/test:
    post:
      tags: [Governed AI]
      summary: Verify a provider connection with live discovery and inference
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      security:
        - BearerSession: []
      responses:
        '200': {description: Live credential and inference verification succeeded}
        '403': {description: Provider connection is outside the caller's scope}
        '422': {description: Live provider verification failed}
  /api/v1/provider-accounts/{id}/discover-models:
    post:
      tags: [Governed AI]
      summary: Discover models from the provider connection's live catalogue
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      security:
        - BearerSession: []
      responses:
        '200': {description: Live discovered model metadata}
        '403': {description: Provider connection is outside the caller's scope}
        '422': {description: Live discovery failed}
  /api/v1/provider-accounts/{id}/models:
    get:
      tags: [Governed AI]
      summary: List discovered and verified models for a provider connection
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      security:
        - BearerSession: []
      responses:
        '200': {description: Model metadata with AVAILABLE, VERIFIED, allowed and default state}
        '403': {description: Provider connection is outside the caller's scope}
  /api/v1/provider-accounts/{id}/models/{modelId}/test:
    post:
      tags: [Governed AI]
      summary: Run a live inference verification for a discovered model
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: modelId, in: path, required: true, schema: {type: string}}
      security:
        - BearerSession: []
      responses:
        '200': {description: Model is live verified and may become routeable}
        '403': {description: Provider connection is outside the caller's scope}
        '404': {description: Model was not returned by the provider's live catalogue}
        '422': {description: Live inference verification failed}
  /api/v1/provider-accounts/{id}:
    patch:
      tags: [Governed AI]
      summary: Update provider routing policy for a visible connection
      description: Only live-verified models may be selected as the default or allowed routes. Credentials are not returned or replaced by this operation.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      security:
        - BearerSession: []
      responses:
        '200': {description: Updated redacted connection metadata}
        '400': {description: Model selection is not live verified}
        '403': {description: Provider connection is outside the caller's scope}
    delete:
      tags: [Governed AI]
      summary: Remove a visible provider connection
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      security:
        - BearerSession: []
      responses:
        '200': {description: Provider connection removed}
        '403': {description: Provider connection is outside the caller's scope}
  /api/v1/gateway/usage:
    get:
      tags: [Governed AI]
      summary: Read aggregate activity for the caller's tenant
      description: Requires an API key with the currently enforced read:inference scope or a tenant-scoped ALTIL session. Does not expose another tenant's activity.
      security:
        - ALTILKey: []
        - BearerSession: []
      responses:
        '200':
          description: Tenant-scoped inference counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId: {type: string}
                  requests: {type: integer}
                  inputTokens: {type: integer}
                  outputTokens: {type: integer}
                  byCapability: {type: object, additionalProperties: {type: integer}}
                  byApplication: {type: object, additionalProperties: {type: integer}}
                  byModel: {type: object, additionalProperties: {type: integer}}
                  lastRequestAt: {type: [string, 'null'], format: date-time}
        '401': {description: API key or session required}
        '403': {description: Tenant scope or inference permission denied}
        '429': {description: Key rate limit reached}
  /api/v1/chat/completions:
    post:
      tags: [Governed AI]
      summary: Create an ALTIL-governed OpenAI-compatible chat completion
      description: The selected model must be present and routeable through an authorized live provider connection. Existing application binding, tenant isolation, rate/spend/licence quotas, policy and compliance checks apply. Provider credentials remain server-side. Streaming is normalized for OpenAI-compatible connections; unsupported native event formats fail closed. When provider usage is unavailable, ALTIL's existing usage ledger uses estimates and the non-streaming response marks them with `altil.usage_estimated=true`.
      security:
        - ALTILKey: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              additionalProperties: false
              properties:
                model: {type: string, description: Exact model ID returned by GET /api/v1/models}
                messages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: {type: string, enum: [system, user, assistant]}
                      content:
                        oneOf:
                          - {type: string}
                          - {type: array, items: {type: object, required: [type, text], properties: {type: {type: string, enum: [text, input_text]}, text: {type: string}}}}
                stream: {type: boolean, default: false}
                temperature: {type: number, minimum: 0, maximum: 2}
                top_p: {type: number, minimum: 0, maximum: 1}
                max_tokens: {type: integer, minimum: 1, maximum: 131072}
                max_completion_tokens: {type: integer, minimum: 1, maximum: 131072}
                stop: {oneOf: [{type: string}, {type: array, maxItems: 4, items: {type: string}}]}
                app_id: {type: string, description: Optional ALTIL application binding; must match the API key's application}
                capability: {type: string, description: Optional existing ALTIL capability selector}
                metadata: {type: object, additionalProperties: true}
                stream_options: {type: object, additionalProperties: true}
      responses:
        '200':
          description: OpenAI-compatible chat completion JSON or text/event-stream when stream=true
          content:
            application/json:
              schema:
                type: object
                required: [id, object, created, model, choices, usage]
                properties:
                  id: {type: string}
                  object: {type: string, const: chat.completion}
                  created: {type: integer}
                  model: {type: string}
                  choices: {type: array, items: {type: object, properties: {index: {type: integer}, message: {type: object, properties: {role: {type: string}, content: {type: string}}}, finish_reason: {type: string}}}}
                  usage: {type: object, properties: {prompt_tokens: {type: integer}, completion_tokens: {type: integer}, total_tokens: {type: integer}}}
                  altil: {type: object, properties: {request_id: {type: string}, usage_reported: {type: boolean}, usage_estimated: {type: boolean}}}
            text/event-stream:
              schema: {type: string, description: Upstream OpenAI-compatible SSE chunks relayed progressively, including data: [DONE]}
        '400': {description: Invalid request or unsupported parameter/content}
        '401': {description: API key or session rejected}
        '402': {description: Tenant, licence, request or spend quota suspended}
        '403': {description: Tenant, key, application, scope or policy boundary denied}
        '404': {description: Model is not present or routeable in the ALTIL registry}
        '422': {description: Request blocked by a policy or compliance guardrail}
        '429': {description: Key rate limit reached}
        '502': {description: OpenRouter provider failure or invalid upstream response}
        '503': {description: Fail-closed guardrail or provider availability error}
  /api/v1/responses:
    post:
      tags: [Governed AI]
      summary: Responses-style completion through existing ALTIL compatibility path
      description: Preserves the existing Responses compatibility behavior. Request is governed by the same tenant, application, quota, policy and compliance checks. Full Responses API feature parity is not claimed.
      security:
        - ALTILKey: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                model: {type: string}
                input: {oneOf: [{type: string}, {type: array, items: {type: object}}]}
                stream: {type: boolean, description: Compatibility mode only; incremental Responses streaming is not guaranteed}
                app_id: {type: string}
                metadata: {type: object, additionalProperties: true}
      responses:
        '200': {description: Responses-style completion in the existing compatibility shape}
        '400': {description: Invalid request}
        '401': {description: API key or session rejected}
        '402': {description: Tenant or licence quota denied}
        '403': {description: Tenant, key, application or policy boundary denied}
        '422': {description: Request blocked by a guardrail}
        '502': {description: Upstream provider failure}
        '503': {description: Provider availability error}
  /v1/models:
    get:
      tags: [Governed AI]
      summary: Alias for GET /api/v1/models
      security:
        - ALTILKey: []
        - BearerSession: []
      responses:
        '200': {description: OpenAI-compatible model list from the ALTIL registry}
        '401': {description: API key or session required}
        '403': {description: Tenant or scope denied}
        '503': {description: OpenRouter runtime is not configured}
  /api/v1/embeddings:
    post:
      tags: [Governed AI]
      summary: Create embeddings through an authorized live provider connection
      description: Routes only to a tenant-authorized, live-verified embedding model. No synthetic fallback is used.
      security:
        - ALTILKey: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                model: {type: string, description: Live-verified embedding model identifier}
                input: {oneOf: [{type: string}, {type: array, items: {type: string}}]}
                encoding_format: {type: string, enum: [float, base64]}
                app_id: {type: string}
      responses:
        '200': {description: Provider embedding response}
        '400': {description: Invalid embedding input}
        '401': {description: API key or session rejected}
        '403': {description: Tenant, application, key, scope or model boundary denied}
        '422': {description: Policy or capability denial}
        '503': {description: No authorized live embedding route or provider unavailable}
  /v1/embeddings:
    post:
      tags: [Governed AI]
      summary: Alias for POST /api/v1/embeddings
      security:
        - ALTILKey: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/paths/~1api~1v1~1embeddings/post/requestBody/content/application~1json/schema'}
      responses:
        '200': {description: Provider embedding response}
        '401': {description: API key or session rejected}
        '403': {description: Tenant, application, key, scope or model boundary denied}
        '503': {description: No authorized live embedding route or provider unavailable}
  /v1/chat/completions:
    post:
      tags: [Governed AI]
      summary: Alias for POST /api/v1/chat/completions
      description: Uses the same OpenAI-compatible request schema, authentication, policy checks, response formats and errors as the /api/v1 route.
      security:
        - ALTILKey: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/paths/~1api~1v1~1chat~1completions/post/requestBody/content/application~1json/schema'}
      responses:
        '200': {description: OpenAI-compatible JSON completion or progressive SSE stream}
        '400': {description: Invalid request}
        '401': {description: API key or session rejected}
        '403': {description: Tenant, key, application or policy boundary denied}
        '404': {description: Model unavailable}
        '422': {description: Policy or compliance denial}
        '502': {description: Upstream provider failure}
        '503': {description: Provider unavailable}
  /v1/responses:
    post:
      tags: [Governed AI]
      summary: Alias for POST /api/v1/responses
      security:
        - ALTILKey: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/paths/~1api~1v1~1responses/post/requestBody/content/application~1json/schema'}
      responses:
        '200': {description: Existing Responses compatibility output}
        '401': {description: API key or session rejected}
        '403': {description: Tenant, key, application or policy boundary denied}
        '502': {description: Upstream provider failure}
  /api/v1/communications/channels:
    get:
      tags: [Communications]
      summary: List configured provider accounts (secrets redacted)
      responses:
        '200': {description: Channel metadata and test status}
    post:
      tags: [Communications]
      summary: Add an SMTP or Firebase account; credentials are encrypted at rest
      responses:
        '201': {description: Channel created without echoing secrets}
  /api/v1/communications/channels/{id}:
    put:
      tags: [Communications]
      summary: Update a provider account
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Channel updated}
    delete:
      tags: [Communications]
      summary: Remove a provider account
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Channel deleted}
  /api/v1/communications/channels/{id}/test:
    post:
      tags: [Communications]
      summary: Test SMTP connection or Firebase service account credentials
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Connection verified}
        '422': {description: Provider test failed}
  /api/v1/communications/messages:
    get:
      tags: [Communications]
      summary: Read encrypted communication history (body decrypted for privileged reader)
      responses:
        '200': {description: Recent campaign and handset messages}
    post:
      tags: [Communications]
      summary: Send a group announcement or individual notice across one or more channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelIds, subject, body]
              properties:
                channelIds: {type: array, items: {type: string}, minItems: 1}
                tenantIds: {type: array, items: {type: string}}
                deviceIds: {type: array, items: {type: string}}
                recipientEmails: {type: array, items: {type: string, format: email}}
                subject: {type: string, maxLength: 200}
                body: {type: string, maxLength: 10000}
      responses:
        '201': {description: Dispatch report with provider acceptance counts}
        '400': {description: Missing recipients or provider}
        '502': {description: All selected provider deliveries failed}
  /api/v1/mobile/devices/register:
    post:
      tags: [Mobile devices]
      summary: Enroll an iOS, Android or web device using a tenant API key
      security:
        - ALTILKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, pushToken, platform]
              properties:
                deviceId: {type: string, minLength: 6, maxLength: 100}
                pushToken: {type: string, writeOnly: true}
                platform: {type: string, enum: [ios, android, web]}
                name: {type: string}
                userId: {type: string}
      responses:
        '201': {description: Enrolled device and one-time device secret}
        '401': {description: Tenant API key rejected}
  /api/v1/mobile/devices:
    get:
      tags: [Mobile devices]
      summary: List registered devices (communications administrator)
      responses:
        '200': {description: Device metadata; no tokens or secrets}
  /api/v1/mobile/devices/{id}:
    patch:
      tags: [Mobile devices]
      summary: Enable or disable a registered device
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Device state updated}
    delete:
      tags: [Mobile devices]
      summary: Remove a registered device
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Device removed}
  /api/v1/mobile/messages/{deviceId}/reply:
    post:
      tags: [Mobile devices]
      summary: Send an authenticated handset-to-ALTIL message
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: string}}
      security:
        - DeviceSecret: []
      responses:
        '201': {description: Message received and stored}
        '401': {description: Device secret rejected}
  /api/v1/mobile/messages/{deviceId}:
    get:
      tags: [Mobile devices]
      summary: Read messages addressed to an authenticated handset
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: string}}
      security:
        - DeviceSecret: []
      responses:
        '200': {description: Messages addressed to this device or its tenant}
        '401': {description: Device secret rejected}
  /api/v1/mobile/messages/{deviceId}/ack:
    post:
      tags: [Mobile devices]
      summary: Record handset read receipts
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: string}}
      security:
        - DeviceSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageIds]
              properties:
                messageIds: {type: array, maxItems: 100, items: {type: string}}
      responses:
        '201': {description: Receipt stored}
        '401': {description: Device secret rejected}
  /api/v1/billing/checkout:
    post:
      tags: [Billing]
      summary: Create a hosted Stripe checkout for a tenant application licence
      description: Requires tenant-admin access and STRIPE_SECRET_KEY. Recurring packages start with the configured trial window.
      responses:
        '200': {description: Stripe checkout session URL}
        '503': {description: Checkout is not configured}
  /api/v1/billing/stripe/webhook:
    post:
      tags: [Billing]
      summary: Verify and reconcile Stripe subscription events
      description: Requires a valid Stripe-Signature within the five-minute tolerance window.
      security: []
      responses:
        '200': {description: Event accepted and reconciled idempotently}
        '401': {description: Stripe signature failed}
        '503': {description: Durable payment event storage failed; Stripe should retry}
  /api/v1/billing/payments/checkout:
    post:
      tags: [Billing]
      summary: Create a hosted one-time invoice payment with Stripe, PayFast or iKhokha
      description: The invoice must belong to the authenticated tenant and have an open balance. Payment is never marked paid from a browser redirect; only a verified provider callback reconciles it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId, provider]
              properties:
                tenantId: {type: string}
                invoiceId: {type: string}
                provider: {type: string, enum: [stripe, payfast, ikhokha]}
                amount: {type: number, exclusiveMinimum: 0}
      responses:
        '201': {description: Pending payment intent and hosted checkout URL}
        '400': {description: Invalid provider, amount or invoice state}
        '403': {description: Tenant access denied}
        '503': {description: Provider unavailable or not configured}
  /api/v1/billing/payments:
    get:
      tags: [Billing]
      summary: List tenant-scoped payment attempts and captured amounts
      description: Provider tokens and hosted checkout secrets are never returned.
      responses:
        '200': {description: Payment history linked to invoices}
  /api/v1/billing/refunds:
    get:
      tags: [Billing]
      summary: List tenant refund requests and their lifecycle status
      responses:
        '200': {description: Tenant-scoped refund records}
    post:
      tags: [Billing]
      summary: Request a partial or full refund against a captured invoice payment
      description: A request reserves its amount against the captured balance and requires finance approval before any provider action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentIntentId, amount, reason]
              properties:
                tenantId: {type: string}
                paymentIntentId: {type: string}
                amount: {type: number, exclusiveMinimum: 0}
                reason: {type: string, minLength: 10, maxLength: 1000}
      responses:
        '201': {description: Refund request recorded for finance approval}
        '400': {description: Invalid reason or amount exceeds remaining captured balance}
        '403': {description: Payment belongs to another tenant}
  /api/v1/billing/refunds/{id}/approve:
    post:
      tags: [Billing]
      summary: Approve and submit a refund to the payment provider
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Refund submitted; final provider confirmation may still be required}
        '409': {description: Payment is not eligible for another refund submission}
  /api/v1/billing/refunds/{id}/confirm:
    post:
      tags: [Billing]
      summary: Record provider completion and post the credit note and payout journals
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerConfirmation, evidence]
              properties:
                providerConfirmation: {type: string, minLength: 3}
                evidence: {type: string, minLength: 10, maxLength: 1000}
      responses:
        '200': {description: Refund confirmation and accounting journals linked}
        '422': {description: Evidence, refund state or accounting posting invalid}
  /api/v1/billing/payment-methods/setup:
    post:
      tags: [Billing]
      summary: Start provider-hosted card token setup after explicit mandate consent
      description: Stripe or PayFast securely vaults the payment method. ALTIL stores only an encrypted provider token; iKhokha public API currently supports hosted one-time payments only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, consent, mandateText]
              properties:
                tenantId: {type: string}
                provider: {type: string, enum: [stripe, payfast]}
                consent: {type: boolean, const: true}
                mandateText: {type: string, minLength: 80}
      responses:
        '201': {description: Hosted mandate setup URL}
        '400': {description: Consent or provider validation failed}
  /api/v1/billing/payment-methods:
    get:
      tags: [Billing]
      summary: List tenant saved gateway tokens without secret material
      responses:
        '200': {description: Masked, tenant-scoped payment method records}
  /api/v1/billing/payment-methods/{id}:
    delete:
      tags: [Billing]
      summary: Revoke a saved token and pause dependent schedules
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Token revoked and schedules paused}
  /api/v1/billing/schedules:
    get:
      tags: [Billing]
      summary: List recurring or threshold-based collection schedules
      responses:
        '200': {description: Tenant-scoped schedule metadata}
    post:
      tags: [Billing]
      summary: Create a separately consented monthly or usage-threshold debit schedule
      description: Usage threshold automation currently requires USD metering and a Stripe mandate. PayFast token charges are ZAR-only. iKhokha supports hosted one-time checkout in the current integration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethodId, scheduleType, consent, consentText]
              properties:
                tenantId: {type: string}
                paymentMethodId: {type: string}
                scheduleType: {type: string, enum: [threshold, monthly]}
                thresholdAmount: {type: number, exclusiveMinimum: 0}
                currency: {type: string, pattern: '^[A-Z]{3}$', description: Configured transaction currency; posted source currency is preserved}
                consent: {type: boolean, const: true}
                consentText: {type: string, minLength: 100}
      responses:
        '201': {description: Schedule created with a consent record}
        '400': {description: Mandate, provider, currency or threshold constraints failed}
  /api/v1/billing/schedules/{id}:
    patch:
      tags: [Billing]
      summary: Pause, resume or cancel automatic invoice collection
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Schedule state updated}
  /api/v1/billing/payfast/webhook:
    post:
      tags: [Billing]
      summary: Verify PayFast ITN and reconcile invoice capture
      security: []
      responses:
        '200': {description: Verified notification reconciled or duplicate acknowledged}
        '401': {description: Merchant/signature/provider validation failed}
        '503': {description: Reconciliation unavailable; provider should retry}
  /api/v1/billing/ikhokha/webhook:
    post:
      tags: [Billing]
      summary: Verify signed iK Pay callback and reconcile invoice capture
      security: []
      responses:
        '200': {description: Signed callback reconciled}
        '401': {description: Signature invalid}
        '503': {description: Reconciliation unavailable; provider should retry}
  /api/v1/billing/accounting/summary:
    get:
      tags: [Billing]
      summary: Tenant-scoped receivables, chart-of-account and monthly journal rollups
      responses:
        '200': {description: Currency-preserving finance dashboard data}
        '503': {description: Accounting migration unavailable}
  /api/v1/billing/accounting/journals:
    get:
      tags: [Billing]
      summary: List tenant journals and debit/credit lines
      responses:
        '200': {description: Posted, immutable journal lines}
    post:
      tags: [Billing]
      summary: Post a balanced admin journal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, currency, description, lines]
              properties:
                tenantId: {type: string}
                currency: {type: string, pattern: '^[A-Z]{3}$', description: Configured transaction currency; posted source currency is preserved}
                description: {type: string}
                lines: {type: array, minItems: 2, maxItems: 100, items: {type: object, required: [accountCode, accountName, debit, credit]}}
      responses:
        '201': {description: Balanced journal posted}
        '422': {description: Journal is unbalanced or storage is unavailable}
  /api/v1/billing/reconciliation/import:
    post:
      tags: [Billing]
      summary: Import provider/bank settlement rows and auto-match payment intents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, statementReference, currency, transactions]
              properties:
                provider: {type: string, enum: [stripe, payfast, ikhokha, bank]}
                statementReference: {type: string}
                currency: {type: string, pattern: '^[A-Z]{3}$', description: Configured transaction currency; posted source currency is preserved}
                transactions: {type: array, minItems: 1, maxItems: 5000, items: {type: object, required: [externalReference, grossAmount, netAmount], properties: {externalReference: {type: string}, grossAmount: {type: number}, feeAmount: {type: number}, netAmount: {type: number}}}}
      responses:
        '201': {description: Reconciliation batch created with matched and exception rows}
        '400': {description: Invalid row, amount or currency}
  /api/v1/billing/reconciliation:
    get:
      tags: [Billing]
      summary: List settlement batches and unreconciled exceptions
      responses:
        '200': {description: Settlement batches and their rows}
  /api/v1/billing/reconciliation/{batchId}/settle:
    post:
      tags: [Billing]
      summary: Post fully matched gateway clearing to bank and processing fees
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Settlement journals posted}
        '409': {description: Unmatched exceptions remain or batch already settled}
  /api/v1/billing/reconciliation/items/{itemId}/match:
    post:
      tags: [Billing]
      summary: Manually link an unmatched statement row to a captured payment
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, paymentIntentId]
              properties:
                provider: {type: string, enum: [stripe, payfast, ikhokha, bank]}
                paymentIntentId: {type: string}
      responses:
        '200': {description: Settlement row matched with currency and amount checks}
        '422': {description: Capture, currency or gross total does not match}
components:
  securitySchemes:
    ALTILKey: {type: apiKey, in: header, name: x-api-key}
    BearerSession: {type: http, scheme: bearer, bearerFormat: ALTIL session}
    DeviceSecret: {type: apiKey, in: header, name: x-device-secret}
  schemas:
    DeveloperApplication:
      type: object
      required: [id, name, status, environment, allowedCapabilities, createdAt, updatedAt]
      properties:
        id: {type: string}
        customerId: {type: [string, 'null']}
        customerName: {type: string}
        parentApplicationId: {type: [string, 'null']}
        applicationType: {type: string, enum: [application, sub_application, function]}
        functionIdentifier: {type: [string, 'null']}
        appIdentifier: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [active, suspended, revoked]}
        environment: {type: string, enum: [development, staging, production]}
        allowedCapabilities: {type: array, items: {type: string}}
        rateLimitRpm: {type: integer}
        quotaMonthlyRequests: {type: integer}
        quotaUsedRequests: {type: integer}
        assignedPolicyIds: {type: array, items: {type: string}}
        contactEmail: {type: string}
        createdAt: {type: string}
        updatedAt: {type: string}
    DeveloperCredentialMetadata:
      type: object
      description: Credential metadata only. Secret and digest are never returned by list/revoke operations.
      required: [id, appId, name, prefix, status, createdAt, rateLimitRpm, scopes]
      properties:
        id: {type: string}
        customerId: {type: [string, 'null']}
        appId: {type: string}
        appName: {type: string}
        name: {type: string}
        prefix: {type: string}
        status: {type: string, enum: [active, revoked, expired]}
        createdAt: {type: string}
        expiresAt: {type: [string, 'null'], format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        rateLimitRpm: {type: integer}
        ipWhitelist: {type: array, items: {type: string}}
        scopes:
          type: array
          description: Existing records may contain legacy values; only read:inference is currently grantable and runtime-enforced.
          items: {type: string}
        billingMode: {type: string, enum: [included, prepaid, metered]}
        monthlyRequestLimit: {type: [integer, 'null']}
        monthlySpendLimitUsd: {type: [number, 'null']}
    DeveloperCredentialIssuedOnce:
      allOf:
        - {$ref: '#/components/schemas/DeveloperCredentialMetadata'}
        - type: object
          required: [key]
          properties:
            key: {type: string, writeOnly: true, description: Full credential secret; returned only at creation and never retrievable afterward}
    DeveloperAuditEvent:
      type: object
      description: Audit metadata. Preview values are returned as stored and are not guaranteed to be policy-redacted by this route.
      required: [id, timestamp, appId, appName, capability, providerName, modelIdentifier, durationSeconds, status]
      properties:
        id: {type: string}
        timestamp: {type: string}
        appId: {type: string}
        appName: {type: string}
        apiKeyPrefix: {type: string}
        requestType: {type: string}
        capability: {type: string}
        providerId: {type: string}
        providerName: {type: string}
        modelId: {type: string}
        modelIdentifier: {type: string}
        durationSeconds: {type: number}
        status: {type: string}
        fallbackAttempted: {type: boolean}
        fallbackProviderName: {type: string}
        fallbackModelIdentifier: {type: string}
        inputTokens: {type: integer}
        outputTokens: {type: integer}
        tokensConsumed: {type: integer}
        costEstimated: {type: number}
        policyApplied: {type: string}
        policyChecksPassed: {type: boolean}
        policyViolations: {type: array, items: {type: string}}
        piiScrubbed: {type: boolean}
        sanitizedPromptPreview: {type: string}
        sanitizedResponsePreview: {type: string}
        promptPreview: {type: string}
        responsePreview: {type: string}
        clientIp: {type: string}
    LegacyOrchestrationResult:
      type: object
      required: [id, requestId, timestamp, capability, executedProvider, executedModel, status]
      properties:
        id: {type: string}
        requestId: {type: string}
        timestamp: {type: string}
        application: {type: object, properties: {id: {type: string}, name: {type: string}}}
        capability: {type: string}
        executedProvider: {type: string}
        selectedProvider: {type: string}
        executedModel: {type: string}
        modelIdentifier: {type: string}
        executedModelId: {type: string}
        selectedModel: {type: string}
        selectedModelId: {type: string}
        fallbackTriggered: {type: boolean}
        knowledgeContextUsed: {type: boolean}
        tenantContextSignalsUsed: {type: boolean}
        knowledgeSources: {type: array, items: {type: object, properties: {id: {type: string}, title: {type: string}, tags: {type: array, items: {type: string}}}}}
        durationSeconds: {type: number}
        tokensConsumed: {type: integer}
        totalTokens: {type: object, properties: {input: {type: integer}, output: {type: integer}}}
        policyPassed: {type: boolean}
        piiScrubbed: {type: boolean}
        policyChecks: {type: array, items: {type: object}}
        steps: {type: array, items: {type: object}}
        output: {type: string}
        response: {type: string}
        status: {type: string}


