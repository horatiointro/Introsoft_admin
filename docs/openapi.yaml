  /api/v1/commercial/evidence-approvals:
    post:
      tags: [Commercial foundation]
      summary: Record a one-use owner approval for commercial creation
      description: Requires an explicitly global SUPER_ADMIN grant and tenant.write permission. The approval is scoped to one organization, operation, optional customer, and for technical scope or Phase B1 catalogue operations the exact target identifiers and normalized requested details. It can be consumed once. All commercial mutations require Idempotency-Key; replay returns the stored result and reuse with a different request returns 409.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, operation, evidenceReference, reason]
              properties:
                organizationId: {type: string}
                operation: {type: string, enum: [ORGANIZATION_CREATE, CUSTOMER_CREATE, LEGAL_ENTITY_CREATE, ACCOUNT_CREATE, ORGANIZATION_TENANT_SCOPE_CREATE, PRODUCT_RELATIONSHIP_CREATE, RESELLER_PRODUCT_AUTHORIZATION_CREATE, RESELLER_PRODUCT_PRICE_CREATE]}
                customerId: {type: string}
                targetTenantId: {type: string}
                targetOrganizationId: {type: string, description: Required for reseller authorization and pricing approvals.}
                targetProductId: {type: string, description: Required for Phase B1 product approval.}
                requestedDetails: {type: object, description: Exact allowlisted operation fields; excludes secrets and unrelated personal data.}
                scopeLinkType: {type: string, enum: [PRIMARY, PRODUCTION, SANDBOX, DEVELOPMENT]}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time, nullable: true}
                evidenceReference: {type: string, maxLength: 180}
                reason: {type: string, maxLength: 500}
      responses:
        '201': {description: Owner approval recorded for one use}
        '403': {description: Global SUPER_ADMIN grant and tenant.write required}
        '409': {description: Idempotency key reused with a different request}
  /api/v1/commercial/organization-tenant-scopes:
    post:
      tags: [Commercial foundation]
      summary: Link a technical tenant to one commercial organization
      description: Requires SUPER_ADMIN, tenant.write, a GLOBAL Super Admin grant, technical tenant authorization, and an exact one-use approval. Organizations may link many tenants; a tenant can have only one overlapping active/effective organization owner. Overlap checks are serialized by locking the technical tenant row. Commercial links do not grant IAM access. All commercial mutations require Idempotency-Key.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      security: [{BearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, tenantId, scopeLinkType, effectiveFrom, approvalId]
              properties:
                organizationId: {type: string}
                tenantId: {type: string}
                scopeLinkType: {type: string, enum: [PRIMARY, PRODUCTION, SANDBOX, DEVELOPMENT]}
                effectiveFrom: {type: string, format: date-time}
                effectiveTo: {type: string, format: date-time, nullable: true}
                approvalId: {type: string}
      responses:
        '201': {description: Effective-dated commercial organization to technical tenant link created}
        '400': {description: Invalid link type or effective period}
        '403': {description: Required Super Admin or tenant.write authorization unavailable}
        '404': {description: Organization or tenant is outside authorized scope}
        '409': {description: Approval unavailable, conflicting scope interval, or changed idempotency request}
  /api/v1/commercial/organizations/{organizationId}/technical-scopes:
