      summary: Create a commercial account for an authorized customer
      description: Requires tenant.write, an explicit customer-organization relationship in authorized scope, and a matching unused owner approval. The customer and account remain distinct records. All commercial mutations require Idempotency-Key; replay returns the stored result and reuse with a different request returns 409. Mutation, approval use, audit row, and idempotency completion share one database transaction.
